<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 420" width="660" height="420">
  <defs>
    <!-- Soft architectural alabaster surface -->
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f8fa" />
      <stop offset="100%" stop-color="#eceef2" />
    </linearGradient>
    <!-- Gentle studio top-center lift -->
    <radialGradient id="glow" cx="50%" cy="34%" r="58%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <!-- Fine precision dot grid -->
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.75" fill="#1d1d1f" fill-opacity="0.06" />
    </pattern>
    <radialGradient id="dotMaskGrad" cx="50%" cy="42%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="72%" stop-color="#ffffff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <mask id="dotMask">
      <rect width="660" height="420" fill="url(#dotMaskGrad)" />
    </mask>
    <!-- Soft ambient shadow for the arrow pill -->
    <filter id="pillShadow" x="-30%" y="-40%" width="160%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#1d1d1f" flood-opacity="0.07" />
    </filter>
    <!-- Directional arrow stroke gradient -->
    <linearGradient id="arrowGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1d1d1f" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#1d1d1f" stop-opacity="0.52" />
    </linearGradient>
  </defs>

  <!-- Studio surface -->
  <rect width="660" height="420" fill="url(#bg)" />
  <rect width="660" height="420" fill="url(#glow)" />
  <rect width="660" height="420" fill="url(#dots)" mask="url(#dotMask)" />

  <!-- Header: miniature 4-pane Centralu mark + wordmark -->
  <g transform="translate(330, 44)">
    <!-- 4-pane mark shifted left of wordmark -->
    <g transform="translate(-57, -9)" opacity="0.42">
      <rect x="0" y="0" width="5.2" height="5.2" rx="1.3" fill="#1d1d1f" />
      <rect x="6.8" y="0" width="5.2" height="5.2" rx="1.3" fill="none" stroke="#1d1d1f" stroke-width="1.25" />
      <rect x="0" y="6.8" width="5.2" height="5.2" rx="1.3" fill="#1d1d1f" />
      <rect x="6.8" y="6.8" width="5.2" height="5.2" rx="1.3" fill="#1d1d1f" />
    </g>
    <text
      x="10"
      y="1"
      text-anchor="middle"
      font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', sans-serif"
      font-size="12.5"
      font-weight="600"
      letter-spacing="0.18em"
      fill="#1d1d1f"
      fill-opacity="0.42"
    >CENTRALU</text>
  </g>

  <!-- Minimalist frosted pill arrow centered between Centralu.app (180, 160) and Applications (480, 160) -->
  <g transform="translate(330, 160)">
    <g filter="url(#pillShadow)">
      <rect
        x="-34"
        y="-18"
        width="68"
        height="36"
        rx="18"
        fill="#ffffff"
        fill-opacity="0.82"
        stroke="#1d1d1f"
        stroke-opacity="0.08"
        stroke-width="1"
      />
    </g>
    <line x1="-15" y1="0" x2="13" y2="0" stroke="url(#arrowGrad)" stroke-width="2" stroke-linecap="round" />
    <polyline
      points="6,-6.5 13.5,0 6,6.5"
      fill="none"
      stroke="#1d1d1f"
      stroke-opacity="0.52"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>

  <!-- Subtle bottom instruction (positioned cleanly above Finder path bar when shown) -->
  <text
    x="330"
    y="294"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif"
    font-size="12.5"
    font-weight="500"
    letter-spacing="0.01em"
    fill="#1d1d1f"
    fill-opacity="0.48"
  >Drag Centralu to Applications</text>
</svg>
