<!--
  C · Dot and orbit — a thin arc wraps a rounded square.
  The plainest of the three, but at small sizes the thin arc is the first thing to disappear
  (check this at 16px).
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <defs>
    <linearGradient id="arc2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#2d6cf0"/><stop offset="0.4" stop-color="#7b3fe4"/>
      <stop offset="0.7" stop-color="#d63aa8"/><stop offset="1" stop-color="#ff8a3d"/>
    </linearGradient>
  </defs>
  <rect x="26" y="26" width="460" height="460" rx="112" fill="#0d0d10"/>
  <circle cx="256" cy="256" r="150" fill="none" stroke="url(#arc2)" stroke-width="10"
          stroke-dasharray="470 472" stroke-linecap="round" transform="rotate(-90 256 256)"/>
  <rect x="196" y="196" width="120" height="120" rx="30" fill="#f5f5f7"/>
</svg>
