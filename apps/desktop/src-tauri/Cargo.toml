# The app and the keeper's own crate (`keeper/`, #440) build as one workspace: one Cargo.lock, one
# target folder, one version. The version lives here once; tooling/brand.test.ts checks it.
[workspace]
members = ["keeper"]
# Both, so `cargo test --lib` on this manifest (CI, AGENTS.md) still runs the keeper's tests.
default-members = [".", "keeper"]

[workspace.package]
version = "0.1.0-beta.11"

[package]
name = "centralu"
version.workspace = true
description = "Agent control tower"
edition = "2021"
# Two executables now (the window and `centralu-keeper`); `cargo run` and `tauri dev` start this one.
default-run = "centralu"
# Raised from 1.77 by the `trash` dependency below, which declares 1.85. CI builds on
# `stable`, so this is a statement of what the tree actually needs, not a new constraint.
rust-version = "1.85"

[lib]
name = "centralu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "centralu"
path = "src/main.rs"

# The keeper as its own executable (#440, thin-shell plan §5). It links `centralu-keeper-core`
# and nothing of Tauri, so it carries no webview and could be started from outside the bundle.
# Tauri bundles every binary of this package next to the main one (`Contents/MacOS/` on macOS,
# `usr/bin/` in the AppImage and the .deb), which is where the window looks for it.
#
# `required-features`: Windows has no keeper (it is built on unix sockets, descriptor passing and
# `flock`), and Tauri leaves a binary out of the bundle when its required features are not among
# the build's `build.features`. tauri.conf.json names `keeper-exe`; tauri.windows.conf.json does
# not. Cargo still builds it everywhere through `default`, so a plain `cargo build` (the keeper
# scripts, CI) produces both executables.
[[bin]]
name = "centralu-keeper"
path = "src/bin/centralu-keeper.rs"
required-features = ["keeper-exe"]

[features]
default = ["keeper-exe"]
keeper-exe = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` was enabled but never used — there is no tray in this app. On Linux that
# feature is not free: it pulls in libappindicator, which needs
# `libayatana-appindicator3-dev` present at build time. Turning off a feature we do not
# use removes a system package from every Linux build. Adding a tray later means adding
# the feature and the apt dependency back together, which is the honest pairing.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The keeper, the host supervisor and the keeper client (#440).
centralu-keeper-core = { path = "keeper" }

# Delete means **sending to the trash** (#18). It has to be a real OS trash, not an unlink
# that moves the file to a temp folder, and the Node sidecar cannot do that, so it lands here.
# `trash` is the standard crate for this ecosystem: on macOS it is `NSFileManager trashItem`,
# and on Linux it implements the freedesktop trash spec 1.0 directly (common to GNOME, KDE and
# XFCE). `chrono` is kept because the Linux side uses it to write the deletion time into the
# trash info file — without it, "when it was deleted" shows up blank in file managers.
#
# `coinit_apartmentthreaded` is the crate's other default, and on Windows it is not optional:
# with neither COM mode selected, `trash`'s Windows backend fails to compile on purpose
# (trash 5.2.6 windows.rs, "THIS IS AN ERROR ON PURPOSE"). macOS and Linux ignore it. The call
# runs on a thread of its own (`send_to_trash` in lib.rs), so the apartment mode cannot clash
# with whatever the calling thread already initialised.
trash = { version = "5", default-features = false, features = ["chrono", "coinit_apartmentthreaded"] }

# The keeper (#280) needs four calls `std` does not offer: `flock` (a lock the OS releases
# when its holder dies), `setsid` (to start detached from the app), `umask`, and the peer uid of
# a unix socket. **Not a new dependency** — libc is already in Cargo.lock through tauri and its
# platform crates; this declares that we call it directly.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Used only to position the traffic light buttons (macOS only).
# **Not a new dependency** — the objc2 family is already pulled in by tauri, tao and wry
# (17 entries in Cargo.lock); this just declares that we are using what is already built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
