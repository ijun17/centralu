[package]
name = "centralu"
version = "0.1.0-beta.2"
description = "에이전트 관제탑"
edition = "2021"
rust-version = "1.77"

[lib]
name = "centralu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` was enabled but never used — there is no tray in this app. On Linux that
# feature is not free: it pulls in libappindicator, which needs
# `libayatana-appindicator3-dev` present at build time. Turning off a feature we do not
# use removes a system package from every Linux build. Adding a tray later means adding
# the feature and the apt dependency back together, which is the honest pairing.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-notification = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# 신호등 버튼 위치를 잡는 데만 쓴다 (macOS 전용).
# **새 의존이 아니다** — objc2 계열은 tauri·tao·wry가 이미 끌어오고 있고
# (Cargo.lock에 17개), 여기서는 이미 빌드되는 것을 쓰겠다고 선언할 뿐이다.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
