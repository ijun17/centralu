name: Cache tauri's AppImage tools
description: AppRun and linuxdeploy, which `tauri build` downloads from GitHub for an AppImage and fetches again only when missing (#2004, a 504 failed a bundle). Linux only; run after pnpm install.
runs:
  using: composite
  steps:
    - id: tauri
      shell: bash
      run: |
        v=$(pnpm --filter @cc/desktop exec tauri --version)
        echo "version=${v##* }" >> "$GITHUB_OUTPUT"

    # tauri-bundler keeps them in the user's cache folder (`dirs::cache_dir()/tauri`) and downloads a file only when it is not there
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/tauri
        key: tauri-tools-${{ runner.arch }}-${{ steps.tauri.outputs.version }}
