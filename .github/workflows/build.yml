# Builds the desktop bundle on every supported platform and keeps the result as an
# artifact.
#
# Why this exists at all (#14): nobody working on this repo owns a Linux machine, so
# CI is not a convenience here — it is the only place a Linux bundle can be produced
# or even proven to compile. Treat a red run on `linux-x64` as the real answer, not as
# a CI quirk.
name: build

on:
  push:
    branches: [main]
  # A draft runs `changes` alone (#1066: a stack's lower PRs are drafts). Marked ready, it runs again;
  # turned into a draft, the run it starts cancels the one going (concurrency below).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:
    inputs:
      # A manual run is the full tier (.github/scripts/ci-changes.mjs): the merge queue's batches, or a
      # person asking for it on a branch (`gh workflow run build.yml --ref <branch>`, CONTRIBUTING.md)
      everything:
        description: Run every job, whatever the commit changes (unticked, the files leave out what they cannot affect)
        type: boolean
        default: true
      # The merge queue's batches ask for the quick tier (#1259): a change lands after the fast tier, and
      # the full tier runs on main once it has landed (.github/scripts/ci-changes.mjs)
      tier:
        description: Which tier a manual run is (quick is the merge queue's batch; a release bump or a commit on main still runs in full)
        type: choice
        options: [full, quick]
        default: full

# Ordinary pushes to a branch supersede earlier work. A release bump can be tagged while its
# build still runs, so its commit gets a separate group: a later merge must not cancel the
# build that publication will wait for (#633). A push to main is never cancelled by the next
# (#1259): changes land after the fast tier, and each main commit's full run is how the merge
# queue's main guard finds what broke main; the queue holds landing while too many are unfinished.
concurrency:
  group: build-${{ github.ref }}${{ github.event_name == 'push' && startsWith(github.event.head_commit.message, 'chore(release):') && format('-release-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which jobs a run needs: its tier, then the files it adds to main (.github/scripts/ci-changes.mjs,
  # 2026-10-17; tiers 2026-10-18, the owner's decision). About 25 jobs run per push and the free plan
  # runs about 20 at once, so every job a run does not need delays the next one.
  #
  # A draft pull request (a stack's lower, #1066) runs `changes` alone, and every other job skips.
  #
  # The quick tier, on a pull request: `changes`, `verify` and the Windows unit tests. The full tier,
  # every job: a push to main, a manual run (the merge queue's batches; a person on a branch) and a
  # release bump's pull request (it changes the file that declares the version). The merge queue lands
  # nothing on the quick tier alone: only from a full run on what lands, which the `full tier` job
  # passing says (skipped on a quick run). Inside the full tier, documents run only `verify`, the
  # `windows tests` jobs and the WebKit UI scenarios; tests skip the bundles, the keeper and the
  # content verifier; the window alone (packages/ui, core, platform, apps/web) skips the keeper, the
  # content verifier and the host's tests on the remotes' Node; a build or CI config runs everything.
  # A pull request is compared with its merge-base with main, whatever its base branch, so a stacked
  # one is judged by the whole stack. The rule reads no event context (docs/releasing.md, event
  # audit). `changes` must be in any required set: it is what the gated jobs wait on.
  #
  # On a full run, a job left out by the files still reports its check under its own name, which a
  # required check waits for: a job without a matrix reports `skipped`; a matrix job has a `…-skipped`
  # stand-in with the same name and matrix, since a skipped matrix job reports its name unexpanded
  # (`${{ matrix.target }}`). Each pair is `== 'true'` / `== 'false'`, so a missing answer, or `off`
  # on a quick run, runs neither. tooling/build-workflow.test.ts holds the pairs together.
  changes:
    name: changes
    runs-on: ubuntu-24.04
    outputs:
      quick: ${{ steps.classify.outputs.quick }}
      full: ${{ steps.classify.outputs.full }}
      bundle: ${{ steps.classify.outputs.bundle }}
      host: ${{ steps.classify.outputs.host }}
      host_tests: ${{ steps.classify.outputs.host_tests }}
      code: ${{ steps.classify.outputs.code }}
      fail_fast: ${{ steps.classify.outputs.fail_fast }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main and the history back to the merge-base, without file contents: names are all it compares
          fetch-depth: 0
          filter: blob:none

      - name: Classify the changed files
        id: classify
        env:
          # Empty on a push or a pull request; set (true by default) on a manual run, which is the full tier
          EVERYTHING: ${{ inputs.everything }}
          DISPATCH_TIER: ${{ inputs.tier }}
        run: node .github/scripts/ci-changes.mjs

  # Passes on a full run only, and is skipped on a quick one: how the merge queue and the release tell a
  # full run from a quick one (project.json `ci.fullTier`). Every check of a skipped job counts as
  # passed, so a quick run alone looks green; the queue lands a pull request only from a run where this
  # one passed (a batch's, or its own full run).
  full-tier:
    name: full tier
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    steps:
      - run: echo "The full tier runs (.github/scripts/ci-changes.mjs)"

  bundle:
    name: ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.bundle == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    # A broken Linux build must not hide a working macOS one — that is exactly the
    # comparison this workflow exists to give us.
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x64
            # Pinned, not `ubuntu-latest`. glibc is forward- but not backward-compatible:
            # link on 24.04 and the binary refuses to start on 22.04 with
            # `GLIBC_2.3x not found`. 22.04 is the oldest image that still ships
            # webkit2gtk-4.1, which makes it the right floor to build against.
            #
            # Two artifacts ride on this, not one. Besides the Tauri binary, node-pty has
            # no Linux prebuild, so `pty.node` is compiled here from source
            # (packages/agent-host/scripts/bundle.mjs) and is glibc-bound the same way.
            # Raising this image raises the minimum distro for both.
            runner: ubuntu-22.04
            # Which bundles get built is not repeated here — `tauri.linux.conf.json`
            # and `tauri.conf.json` decide, and duplicating that list is how the two
            # drift apart. If either stops producing a bundle, the upload step below
            # fails rather than reporting a green build that shipped nothing.
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          # linux-arm64 (#29) — commented out on purpose, not missing.
          #
          # The runner exists at the right distro floor: GitHub hosts `ubuntu-22.04-arm`,
          # the same major version as the x64 pin above, so this would NOT raise the
          # minimum glibc for arm64 users the way an arm64-only-on-24.04 runner would have
          # (GA for public repos 2025-08-07, https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/;
          # label confirmed again by Tauri's own CI guide, https://v2.tauri.app/distribute/pipelines/github/).
          # Private-repo support followed later — GA 2026-01-29,
          # https://github.blog/changelog/2026-01-29-arm64-standard-runners-are-now-available-in-private-repositories/
          # — but *not* free like public-repo usage: it draws down the plan's included
          # minutes and then bills at (per GitHub's rate card at the time of writing)
          # $0.005/min for the 2-vCPU tier. `ijun17/centralu` happens to be a public repo
          # right now, where this runner is free, but that can change, and this job fires
          # on every push and every PR with no human in the loop — the one thing this
          # comment cannot do is let a repo-visibility flip turn into a silent bill. A
          # `workflow_dispatch`-gated job would have made that judgment call each run; a
          # commented line makes it impossible to run by accident either way.
          #
          # Enabled 2026-08-20: the repo is public, where this runner is free, and #29's
          # open questions (does node-pty compile on arm64? does the AppImage bundle?)
          # can only be answered by running it. If the repo ever goes private again,
          # re-comment this entry first — see the billing note above.
          - target: linux-arm64
            runner: ubuntu-22.04-arm
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              apps/desktop/src-tauri/target/release/bundle/deb/*.deb
          #
          # That alone does not make this a working build — nothing arm64 has ever run
          # here. `node-pty` has no Linux prebuild at any architecture, so `pty.node` is
          # compiled by node-gyp on whatever runs this job, and that has only ever been
          # exercised on x64; `better-sqlite3` raises the identical question. The first
          # uncommented run is genuinely the first time either gets an answer. See
          # docs/releasing.md → "Adding a platform" → linux-arm64 (#29) for what to wire
          # up alongside the uncomment (the shim's `optionalDependencies`, the launcher).
          - target: darwin-arm64
            # Pinned for the same reason: `macos-latest` moves between Xcode and SDK
            # versions without warning, and a release build is not the place to find out.
            # macos-15, not macos-14: GitHub retires the macOS 14 images on 2026-11-02 (runner-images#13518).
            # The newer Xcode and SDK do not change the oldest macOS the app runs on: the build step
            # below states it, and the step after it checks it.
            runner: macos-15
            # npm publishes the `.app`; no workflow consumes the DMG (#628).
            # Tar the app first (below) to preserve its executable bits and signature.
            artifacts: |
              apps/desktop/src-tauri/target/release/bundle/macos/Centralu-app.tar.gz
          # windows-x64 (#14, phase W1). Pinned like the others: `windows-latest` moves to a new
          # Visual Studio and Windows SDK without warning.
          #
          # Two things come out, uploaded as two artifacts:
          #   - `centralu-windows-x64`: a portable folder, `Centralu\centralu.exe` plus
          #     `Centralu\resources\host\`. This is the shape the npm package can ship in W3, the
          #     way the AppImage ships for Linux: npm can unpack a folder and start an exe, but
          #     it cannot run an installer. Tauri resolves its resource folder next to the exe
          #     when nothing is installed, so the folder runs as it is.
          #   - `centralu-windows-x64-setup`: the NSIS installer (`tauri.windows.conf.json`),
          #     per-user, no admin rights. The one thing it does that the folder cannot is
          #     install the WebView2 runtime when a machine lacks it.
          - target: windows-x64
            runner: windows-2022
            artifacts: |
              apps/desktop/src-tauri/target/release/portable/

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The release tags, without file contents: the artifact carries the release this commit was cut from (#1501)
          fetch-depth: 0
          filter: blob:none

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        # webkit2gtk is the webview Tauri renders into. The rest of the first group is
        # Tauri's documented prerequisite list, kept whole rather than trimmed to what
        # today's cargo features happen to need: the `tray-icon` feature has already been
        # turned on and off once, and a build dependency that disappears when a feature
        # flips is a slow, confusing failure. These packages cost seconds to install, and
        # CI is the only place the Linux build is exercised at all — the wrong place to
        # be clever. patchelf and libfuse2 are not Tauri dependencies but AppImage tooling
        # ones: linuxdeploy rewrites rpaths with patchelf, and is itself distributed as an
        # AppImage, so it needs FUSE to run.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # The host sidecar targets node22 (packages/agent-host/scripts/bundle.mjs), and
          # the native addons are compiled against whatever node runs here.
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # The cache is only valid per platform; the key would otherwise collide.
          key: ${{ matrix.target }}

      - run: pnpm install --frozen-lockfile

      - name: Stamp the version
        # Git holds none (#1501): the newest release tag reachable from this commit, as `pnpm app` builds locally, so a
        # person trying this artifact on a machine that ran that release is not refused as a downgrade. A fork without
        # tags keeps the placeholder. The release itself stamps in release-npm.mts, from the tag it publishes.
        shell: bash
        run: node scripts/stamp-version.mjs "$(node scripts/app-version.mjs --fallback)"

      - name: Build bundle
        if: runner.os != 'macOS'
        env:
          # linuxdeploy and appimagetool are AppImages themselves and mount via FUSE.
          # GitHub runners can refuse that, and when they do the failure is a bare
          # "failed to run linuxdeploy" with nothing pointing at FUSE. This tells the
          # tooling to unpack and run instead, which works with or without /dev/fuse.
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: pnpm --filter @cc/desktop exec tauri build

      - name: Build macOS app
        if: runner.os == 'macOS'
        # The unused DMG's intermittent bundle_dmg.sh failures must not block releases.
        env:
          # The oldest macOS the app runs on (what rustc targets for arm64, and what the app was built for on
          # macos-14), stated rather than left to the toolchain and the runner's SDK, which a later Xcode could raise.
          MACOSX_DEPLOYMENT_TARGET: '11.0'
        run: pnpm --filter @cc/desktop exec tauri build --bundles app

      - name: Check the oldest macOS the app runs on
        if: runner.os == 'macOS'
        # Each executable in the bundle says the macOS it was built for (`minos`). A newer SDK or a dependency that
        # builds C code can raise it without any error, and the app would then fail to open on the older Macs.
        working-directory: apps/desktop/src-tauri/target/release/bundle/macos
        run: |
          set -euo pipefail
          for exe in Centralu.app/Contents/MacOS/*; do
            minos=$(otool -l "$exe" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')
            echo "$exe: minos ${minos:-none}"
            [ "$minos" = "11.0" ] || { echo "::error::$exe was built for macOS ${minos:-none}, not 11.0"; exit 1; }
          done

      - name: Tar the .app
        if: runner.os == 'macOS'
        # A GitHub artifact is a zip, and zipping drops the exec bit — download the `.app`
        # that way and it cannot open. tar preserves the mode bits and the signed
        # `_CodeSignature` tree, so the zip ends up wrapping something lossless.
        # `pnpm release:npm` uses ditto for the same reason on the publishing path.
        working-directory: apps/desktop/src-tauri/target/release/bundle/macos
        run: tar czf Centralu-app.tar.gz ./*.app

      - name: Stage the portable Windows folder
        if: runner.os == 'Windows'
        # The host resources are taken from `src-tauri/resources`, which `bundle:host` has just
        # written, rather than the copy under `target/release`: that copy is made by the build
        # script, and a build script the cache let skip would leave an older host beside a new exe.
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tauri = 'apps/desktop/src-tauri'
          $out = "$tauri/target/release/portable/Centralu"
          Remove-Item -Recurse -Force "$tauri/target/release/portable" -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force "$out/resources" | Out-Null
          Copy-Item "$tauri/target/release/centralu.exe" $out
          Copy-Item -Recurse "$tauri/resources/host" "$out/resources/host"
          if (-not (Test-Path "$out/resources/host/main.mjs")) { throw 'the host bundle is missing from the portable folder' }
          if (-not (Test-Path "$out/resources/host/node_modules/node-pty/prebuilds/win32-x64/conpty.node")) { throw 'conpty.node is missing: the terminal would not start' }
          Get-ChildItem -Recurse $out | Measure-Object -Property Length -Sum | ForEach-Object { "portable folder: $($_.Count) files, $([math]::Round($_.Sum / 1MB, 1)) MB" }

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: centralu-${{ matrix.target }}
          path: ${{ matrix.artifacts }}
          # Without this, a build that silently bundles nothing looks like a green run.
          if-no-files-found: error

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: runner.os == 'Windows'
        with:
          name: centralu-${{ matrix.target }}-setup
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # The Rust unit tests, on the one platform where nobody can run them by hand. `dist/` and
      # `resources/host/` exist by now, which `generate_context!` and the resource glob need.
      - name: Rust unit tests
        if: runner.os == 'Windows'
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --lib

  # The bundles' checks when nothing a bundle is built from changed (see `changes`)
  bundle-skipped:
    name: ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.bundle == 'false'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        target: [linux-x64, linux-arm64, darwin-arm64, windows-x64]
    steps:
      - run: echo "Nothing a bundle is built from changed (.github/scripts/ci-changes.mjs)"

  # `pnpm verify` on every run, quick tier included (2026-10-05). Until this job existed the full suite ran
  # only inside release.yml, so a change merged with a partial local run surfaced in the release
  # rehearsal instead: #333 renamed the Windows package, and tooling/release-workflow.test.ts,
  # which derived the old name, failed the 0.1.0-beta.9 rehearsal on all three Unix platforms.
  # Linux, because it is also where the Unix-only surprises live (dash as sh, relative symlinks,
  # Node 22's EventTarget all failed there first).
  verify:
    name: verify
    needs: changes
    if: needs.changes.outputs.quick == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main's history without file contents (a file is fetched when read): tooling/type-aware-lint.test.ts
          # compares the lint allowlists with main's at the merge base (#1339), and CC_LINT_BASE below makes a
          # missing base a failure here
          fetch-depth: 0
          filter: blob:none

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The app's JS is judged against main's, not a constant every UI pull request raised (#1181,
      # tooling/bundle-budget.mjs). Every run fetches the newest record a push to main uploaded (or
      # measures main when none has one), styles.test.ts compares with it and fails when it could not,
      # and every run uploads its own; the same steps on every event (.github/scripts/bundle-base.mjs).
      - name: Main's bundle size
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node .github/scripts/bundle-base.mjs "$RUNNER_TEMP/bundle-base"

      - run: pnpm verify
        env:
          CC_BUNDLE_BASE: ${{ runner.temp }}/bundle-base
          CC_BUNDLE_RECORD: ${{ runner.temp }}/bundle-size
          CC_LINT_BASE: origin/main

      # Also when verify failed: main's record is main's size whatever else went wrong, and the runs
      # after it need one (styles.test.ts writes it before comparing)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: bundle-size
          path: ${{ runner.temp }}/bundle-size/bundle-size.json
          if-no-files-found: error
          # A re-run of the job uploads it again under the same name
          overwrite: true
          # The runs after this one read main's newest record; a long quiet spell on main must not expire it
          retention-days: 90

  # Fail fast (2026-10-19, the owner's decision): on a manual run, the merge queue's batches, a failed `verify`
  # cancels the rest of the run at once. Nothing lands from a run whose `verify` failed, and its e2e shards kept the
  # batch, and the runners every other run waits for, another 10 minutes before the queue heard. Which runs:
  # `changes` says (`fail_fast`, .github/scripts/ci-changes.mjs): a manual run, never a pull request's (quick tier
  # keeps every job to its end), never main's, never one that changes the version (a release bump's run is never cut
  # short, docs/releasing.md).
  #
  # Its own job, after `verify` has ended, not a step inside it: `verify`'s check stays `failure`, which is how the
  # queue tells this run, `cancelled` as a whole, from one cancelled for nothing (no rerun for a test failure). This
  # job then reports `cancelled` itself, with the run. It cancels this run by its id and nothing else, so the
  # concurrency group above is untouched.
  fail-fast:
    name: fail fast
    needs: [changes, verify]
    if: ${{ !cancelled() && needs.verify.result == 'failure' && needs.changes.outputs.fail_fast == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Cancel the rest of this run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          echo "::error title=verify failed: the rest of this run is cancelled::verify failed in a manual run (the merge queue's batches), so nothing can land from it: the jobs still running are cancelled (fail fast). Read verify's log; the cancelled jobs are not failures of their own."
          gh run cancel "$RUN_ID"

  # The content verifier (docs/plans/thin-shell.md §4): the signature check and the copy the shell
  # and the keeper will run before starting anything from a content folder. A small crate with no
  # Tauri, so it builds in seconds. Both Unix platforms, because the copy is `openat` and an
  # exclusive rename, which are spelled differently on each (renamex_np, renameat2).
  content-verify:
    name: content verify (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: cargo test
        run: cargo test --manifest-path apps/desktop/content-verify/Cargo.toml

  content-verify-skipped:
    name: content verify (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.host == 'false'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        runner: [ubuntu-24.04, macos-15]
    steps:
      - run: echo "Nothing outside the window and the tests changed (.github/scripts/ci-changes.mjs)"

  # The TypeScript suite on Windows (#14). Until this job existed `pnpm verify` ran only inside
  # release.yml, on Linux and macOS, so nothing ever told us what breaks on Windows.
  #
  # Every step blocks, as on the other platforms. The unit tests did not at first (phase W1): their
  # known failures were the W2 checklist in #307, and the step carried `continue-on-error` with a
  # warning that counted them, because a check that is red on every PR teaches everyone to stop
  # reading CI. W2 emptied that list, so a red step here is a new Windows failure.
  #
  # Three jobs, not one (#1035): as one it was the longest job of every run, about 16.5 minutes,
  # 15 of them `pnpm test` (main, 2026-10-17). This one keeps the name `windows tests` and runs
  # lint, dependency rules and types (about a minute), so the check every required set already
  # names (the board's, read from main's workflow) still reports; `windows-tests-unit` runs the
  # unit tests in two shards side by side.
  #
  # Tiers (2026-10-18): the unit tests are in the quick tier, every pull request; lint and types, which
  # `verify` already runs on Linux, only in the full one. Of the 140 failed pull request runs from
  # 2026-10-11 to 2026-10-18, 94 passed `verify`, and 53 of those failed `windows tests` (then one
  # job, its unit tests): no other job caught as much that `verify` did not.
  windows-tests:
    name: windows tests
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Three parts of `pnpm verify`, as separate steps that each run whatever the one before
      # said, so one failure does not hide the next. The fourth, the tests, is the job below.
      - run: pnpm lint
      - if: ${{ !cancelled() }}
        run: pnpm depcruise
      - if: ${{ !cancelled() }}
        run: pnpm typecheck

  # The unit tests on Windows, the rest of the job above, in two shards (#1035) split by each test file's measured
  # time (tooling/test-durations.json, docs/plans/os-layer.md §6.4). In the quick tier.
  #
  # Only the tests that touch the OS (#1599, docs/plans/os-layer.md): those that reach the OS layer, a file still on
  # tooling/os-allowlist.txt or anything else in the shipped code that imports an OS module or asks which OS this is,
  # picked by the lint rule's own judgement (tooling/os-tests.ts). The rest run once, on Linux, in `verify`.
  windows-tests-unit:
    name: windows tests (vitest ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.quick == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # `shards` is one value, the count `--shard` divides by; `shard` has to list 1 to it.
        shards: [2]
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # This shard's half of them, split by each file's measured time (tooling/test-durations.json), not by count:
      # by count, the two longest files (875 and 861 s) fell in one shard, 19.1 minutes against 11.4 (#1599).
      # Computed here rather than once in a job of its own: that job would make both shards wait for its setup (#1599).
      - name: Pick the tests that touch the OS
        run: pnpm exec tsx tooling/os-tests.ts --shard ${{ matrix.shard }}/${{ matrix.shards }} --out "${{ runner.temp }}\os-tests.txt"

      - name: pnpm test (shard ${{ matrix.shard }}/${{ matrix.shards }})
        # Never the real data folder, on any OS (AGENTS.md).
        env:
          CC_DATA_DIR: ${{ runner.temp }}\centralu-data
          # The tests picked above (vitest.config.ts)
          CC_TEST_FILES: ${{ runner.temp }}\os-tests.txt
          # styles.test.ts compares the app's JS with main's in the verify job, and fails in CI unless told where
          CC_BUNDLE_COMPARED_BY: verify
        # `pnpm test` is `vitest run`, called directly. The JSON report is each file's time, which refreshes
        # tooling/test-durations.json (`tsx tooling/os-tests.ts --refresh-durations`, docs/plans/os-layer.md §6.4).
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile.json="${{ runner.temp }}\vitest-times.json"

      - name: Keep the test times
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-test-times-${{ matrix.shard }}
          path: ${{ runner.temp }}\vitest-times.json
          retention-days: 30
          if-no-files-found: warn

  # The UI scenarios (e2e/, Playwright) in WebKit, on every full run (owner decisions, 2026-10-11:
  # every pull request; 2026-10-18: every full run, which is what lands). The desktop app is WKWebView,
  # and until this job existed no CI job ran Playwright at all: nine WebKit-only failures piled up on
  # main unseen (#424), two of them real product bugs (#480). `E2E_BROWSER=webkit` runs every spec in
  # WebKit (e2e/playwright.config.ts). Not gated by the files: every full run has it, documents only
  # included.
  #
  # Sharded so the job finishes inside the time the slowest other job already takes (`windows
  # tests`, about 6.5 minutes). Measured 2026-10-11: the suite is about 18 minutes of one runner's
  # time; 4 shards took 5.7 to 6.3 minutes a job, 5 take 3.9 to 5.3 (about 45 seconds of it setup
  # and installing WebKit). Playwright's default of 2 workers on these 4-CPU runners: 3 workers
  # were no faster. Each shard runs a slice of the tests with its own dev servers and hosts; every
  # shard keeps a blob report, and when one fails the `e2e report` job below merges them into one
  # HTML report with traces. A failed test runs once more (Playwright's `retries`, CI only), and one
  # that passes then is flaky, not green: e2e/flaky-report.ts names it on the run and has `e2e
  # report` merge the shards too, so it gets fixed (2026-10-19, the owner's decision; until then a
  # failed shard ran whole a second time, 11 of 100 WebKit shards in the 20 green full runs before).
  #
  # Time limits (2026-10-19): one shard hung 35 minutes and held a merge batch. A job's limit is its
  # slowest green run of the last 20 full runs with about half again on top, so a hang ends as a
  # timeout soon after any honest run would have ended. The numbers, in minutes, slowest/limit:
  # e2e shards 9.7/15 (WebKit; Chromium 8.3), verify 10.8/20, Windows unit tests 13.1/25 (14.9 in the
  # last 100 pushes to main), Windows lint and types 2.6/10, the host's tests on the remotes' Node
  # 12.8/20, content verify 1.8/10, ux tasks 2.8/10. The three jobs that install a browser (#1503, 2026-10-24) limit
  # the install apart from the tests: each of its tries 3 minutes, so the job holds the install's 9 at worst, the
  # tests' own step limit (12 for a shard, 5 for ux tasks) and about 4 for the rest: shards 25, ux tasks 20. Jobs that build Rust with a cache get more, for
  # the run that misses it: bundles 5.8/30 (8.9 in the last 100 pushes), keeper e2e 4.0/20 (Linux
  # 4.4/20). Raise a limit when its job grows, not when one run hangs.
  e2e:
    name: e2e (webkit ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.full == 'true'
    runs-on: ubuntu-24.04
    # See the time limits above
    timeout-minutes: 25
    outputs:
      # `true` when a test of a shard passed only on retry (e2e/flaky-report.ts); a shard without one leaves it unset
      flaky: ${{ steps.e2e.outputs.flaky }}
    strategy:
      fail-fast: false
      matrix:
        # `shards` is one value, the count `--shard` divides by; `shard` has to list 1 to it.
        shards: [5]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Never the real data folder (AGENTS.md). The hosts the specs start get folders of their own.
      - name: Point CC_DATA_DIR at a temporary folder
        run: echo "CC_DATA_DIR=$RUNNER_TEMP/centralu-data" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # WebKit at the build this lockfile's Playwright expects (the browsers are cached by its version), and the system
      # libraries it needs. The libraries are about 140 apt packages from a mirror that was sometimes slow (usually 20 to
      # 45 s, 244 to 893 s on some shards, which cancelled three shards at the job's limit, #1503), so each try has a
      # limit of its own and one retry: the install may take its 9 minutes at worst, and the tests keep theirs. The
      # runner kills the step of a try that hit its limit, not the root apt-get it started, which goes on holding
      # dpkg's locks; the second try stops it first (.github/scripts/stop-leftover-apt.sh). Limits and a retry were not
      # enough on 2026-10-26 (#1592, #1597): both tries timed out on the mirror. So the downloaded .deb files are cached,
      # by runner image and Playwright's version, and put back in apt's archive folder before the install; apt then asks
      # the network for the package lists only (.github/scripts/apt-deb-cache.sh). The cache is saved right after a
      # successful install, not at the end of the job, so a failed test run does not keep it from filling.
      - name: Read Playwright's version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Read the runner image
        id: image
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-webkit

      - name: Restore the apt packages of an earlier run
        id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.name }}-playwright-${{ steps.playwright.outputs.version }}-webkit

      - name: Put the apt packages where apt looks
        run: bash .github/scripts/apt-deb-cache.sh restore "$RUNNER_TEMP/apt-debs"

      - name: Install WebKit system libraries
        id: libraries
        timeout-minutes: 3
        continue-on-error: true
        run: pnpm exec playwright install-deps webkit

      - name: Install WebKit system libraries, second try
        if: steps.libraries.outcome == 'failure'
        timeout-minutes: 3
        run: |
          bash .github/scripts/stop-leftover-apt.sh
          sudo dpkg --configure -a || true
          pnpm exec playwright install-deps webkit

      - name: Keep the apt packages this run downloaded
        id: kept
        if: steps.debs.outputs.cache-hit != 'true'
        run: bash .github/scripts/apt-deb-cache.sh save "$RUNNER_TEMP/apt-debs"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.debs.outputs.cache-hit != 'true' && steps.kept.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.name }}-playwright-${{ steps.playwright.outputs.version }}-webkit

      - name: Install WebKit
        timeout-minutes: 3
        run: pnpm exec playwright install webkit

      - name: pnpm e2e (shard ${{ matrix.shard }}/${{ matrix.shards }})
        id: e2e
        timeout-minutes: 12
        env:
          E2E_BROWSER: webkit
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          # One name per shard, so the merge below does not overwrite one shard's report with another's
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        # A failed test runs once more (e2e/playwright.config.ts `retries`), and one that passes then is named by
        # e2e/flaky-report.ts: an annotation, the job summary and `flaky=true` on this step's outputs
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=list,blob,./e2e/flaky-report.ts --trace=retain-on-failure

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-webkit-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
          if-no-files-found: error

  # The same suite in Chromium (owner decision, 2026-10-12): the Windows app renders in WebView2,
  # which is Chromium, so both engines are the app somewhere. `E2E_BROWSER=chromium` runs every spec
  # in Chromium and leaves out the WebKit twins and grid-ring.spec.ts, which the job above covers.
  # Its own job, not a row of the one above, so each engine can have its own shard count.
  e2e-chromium:
    name: e2e (chromium ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    # See the time limits above the WebKit job
    timeout-minutes: 25
    outputs:
      flaky: ${{ steps.e2e.outputs.flaky }}
    strategy:
      fail-fast: false
      matrix:
        # `shards` is one value, the count `--shard` divides by; `shard` has to list 1 to it.
        shards: [5]
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Never the real data folder (AGENTS.md). The hosts the specs start get folders of their own.
      - name: Point CC_DATA_DIR at a temporary folder
        run: echo "CC_DATA_DIR=$RUNNER_TEMP/centralu-data" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # As the WebKit job's install: the browser cached by Playwright's version, each try limited, one retry (#1503)
      - name: Read Playwright's version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Read the runner image
        id: image
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium

      - name: Restore the apt packages of an earlier run
        id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.name }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Put the apt packages where apt looks
        run: bash .github/scripts/apt-deb-cache.sh restore "$RUNNER_TEMP/apt-debs"

      - name: Install Chromium system libraries
        id: libraries
        timeout-minutes: 3
        continue-on-error: true
        run: pnpm exec playwright install-deps chromium

      - name: Install Chromium system libraries, second try
        if: steps.libraries.outcome == 'failure'
        timeout-minutes: 3
        run: |
          bash .github/scripts/stop-leftover-apt.sh
          sudo dpkg --configure -a || true
          pnpm exec playwright install-deps chromium

      - name: Keep the apt packages this run downloaded
        id: kept
        if: steps.debs.outputs.cache-hit != 'true'
        run: bash .github/scripts/apt-deb-cache.sh save "$RUNNER_TEMP/apt-debs"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.debs.outputs.cache-hit != 'true' && steps.kept.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.name }}-playwright-${{ steps.playwright.outputs.version }}-chromium

      - name: Install Chromium
        timeout-minutes: 3
        run: pnpm exec playwright install chromium

      - name: pnpm e2e (shard ${{ matrix.shard }}/${{ matrix.shards }})
        id: e2e
        timeout-minutes: 12
        env:
          E2E_BROWSER: chromium
          PLAYWRIGHT_BLOB_OUTPUT_DIR: blob-report
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-${{ matrix.shard }}.zip
        # A failed test runs once more (e2e/playwright.config.ts `retries`), and one that passes then is named by
        # e2e/flaky-report.ts: an annotation, the job summary and `flaky=true` on this step's outputs
        run: pnpm e2e --shard=${{ matrix.shard }}/${{ matrix.shards }} --reporter=list,blob,./e2e/flaky-report.ts --trace=retain-on-failure

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: e2e-blob-chromium-${{ matrix.shard }}
          path: blob-report
          retention-days: 7
          if-no-files-found: error

  # The Chromium shards' checks when only documents changed (see `changes`)
  e2e-chromium-skipped:
    name: e2e (chromium ${{ matrix.shard }}/${{ matrix.shards }})
    needs: changes
    if: needs.changes.outputs.code == 'false'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        shards: [5]
        shard: [1, 2, 3, 4, 5]
    steps:
      - run: echo "Only documents changed (.github/scripts/ci-changes.mjs)"

  # One HTML report per engine out of its shards' blob reports, with the traces of the tests that
  # failed. Per engine, because both runs have the same projects and test ids: merged together, one
  # engine's result for a test would stand in for the other's. Only when a shard failed or a test
  # passed only on retry (the shards' `flaky` output): the report's Flaky filter shows the failed
  # attempt with its trace, and the job's summary lists every flaky test per engine. A green run with
  # neither has nothing in it worth downloading. One job with a step per engine, not a matrix: a skipped
  # matrix job reports its name unexpanded (`e2e report (${{ matrix.engine }})`), which is not the
  # name a required check would wait for.
  e2e-report:
    name: e2e report
    needs: [e2e, e2e-chromium]
    if: ${{ !cancelled() && (needs.e2e.result == 'failure' || needs.e2e-chromium.result == 'failure' || needs.e2e.outputs.flaky == 'true' || needs.e2e-chromium.outputs.flaky == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: e2e-blob-*
          path: blobs

      # download-artifact puts each artifact in a folder of its own name: e2e-blob-<engine>-<shard>
      - name: Merge the shard reports, per engine
        run: |
          set -euo pipefail
          for engine in webkit chromium; do
            mkdir -p "merge/$engine"
            for dir in blobs/e2e-blob-"$engine"-*; do
              if [ -d "$dir" ]; then cp "$dir"/*.zip "merge/$engine/"; fi
            done
            if ls "merge/$engine"/*.zip >/dev/null 2>&1; then
              # The flaky tests' table goes to this job's summary under the engine's name; their annotations came from the shards
              E2E_FLAKY_LABEL="$engine" PLAYWRIGHT_HTML_OUTPUT_DIR="e2e-report/$engine" pnpm exec playwright merge-reports --reporter html,./e2e/flaky-report.ts "./merge/$engine"
            fi
          done

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report
          path: e2e-report
          retention-days: 14
          if-no-files-found: error

  # What the core tasks cost in keyboard and mouse operations (#518, docs/ux-metrics.md): the
  # `*.task.ts` scenarios against the mock, priced by the Keystroke-Level Model. A task over its
  # budget fails this job. The table, and the comparison with the committed baseline, go to the
  # job's summary; the JSON is kept as an artifact for `pnpm ux:report --compare`.
  #
  # One engine, WebKit (the desktop app on macOS and Linux): operator counts do not depend on the
  # engine, and pointing times only a little, so a second engine would double the cost for no new
  # answer. Its own job rather than a step in an e2e shard, so it adds no time to any of them:
  # measured on this PR, the whole job takes about as long as its setup (about 1.5 minutes), while
  # the slowest e2e shard takes 4 to 5.
  ux-tasks:
    name: ux tasks
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Never the real data folder (AGENTS.md); the mock starts no host, but the rule has no exceptions
      - name: Point CC_DATA_DIR at a temporary folder
        run: echo "CC_DATA_DIR=$RUNNER_TEMP/centralu-data" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # As the WebKit shards' install (#1503)
      - name: Read Playwright's version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"

      - name: Read the runner image
        id: image
        run: echo "name=${ImageOS:-unknown}-${ImageVersion:-unknown}" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-webkit

      - name: Restore the apt packages of an earlier run
        id: debs
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.name }}-playwright-${{ steps.playwright.outputs.version }}-webkit

      - name: Put the apt packages where apt looks
        run: bash .github/scripts/apt-deb-cache.sh restore "$RUNNER_TEMP/apt-debs"

      - name: Install WebKit system libraries
        id: libraries
        timeout-minutes: 3
        continue-on-error: true
        run: pnpm exec playwright install-deps webkit

      - name: Install WebKit system libraries, second try
        if: steps.libraries.outcome == 'failure'
        timeout-minutes: 3
        run: |
          bash .github/scripts/stop-leftover-apt.sh
          sudo dpkg --configure -a || true
          pnpm exec playwright install-deps webkit

      - name: Keep the apt packages this run downloaded
        id: kept
        if: steps.debs.outputs.cache-hit != 'true'
        run: bash .github/scripts/apt-deb-cache.sh save "$RUNNER_TEMP/apt-debs"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.debs.outputs.cache-hit != 'true' && steps.kept.outputs.count != '0'
        with:
          path: ${{ runner.temp }}/apt-debs
          key: apt-debs-${{ runner.os }}-${{ steps.image.outputs.name }}-playwright-${{ steps.playwright.outputs.version }}-webkit

      - name: Install WebKit
        timeout-minutes: 3
        run: pnpm exec playwright install webkit

      - name: pnpm ux
        timeout-minutes: 5
        env:
          UX_REPORT: ux-report/report.json
          UX_BASELINE: e2e/ux/baseline.json
        run: pnpm ux

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: ux-report
          path: ux-report
          retention-days: 14
          if-no-files-found: error

  # The host's tests on the Node a remote runs (docs/plans/remote-hub.md §10.2; owner decision 1 of
  # §10.9, 2026-10-08). A machine the hub installs runs the host on the Node pinned in
  # packaging/remote-runtime.json, not on the 22 every other job here uses, so a host change that
  # only works on 22 would pass every other check and break every remote. Added beside the jobs above,
  # not in place of them: the app's own host still runs on whatever Node the person has, 22 or later.
  #
  # The host, its protocol and the npm launcher, which is what a remote runs. Linux and Windows,
  # the two systems the installer serves. The version comes from the pin itself, so moving the pin
  # (scripts/node-pin.mjs --set) moves this job with it; tooling/node-pin.test.ts holds the two together.
  host-tests-remote-node:
    name: host tests, remote Node (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.host_tests == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2022]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read the pinned Node
        id: pin
        shell: bash
        run: echo "node=$(node -p 'require("./packaging/remote-runtime.json").node.version')" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.pin.outputs.node }}
          cache: pnpm

      # The native modules (better-sqlite3, node-pty) are fetched or built for the Node running here
      - run: pnpm install --frozen-lockfile

      - name: Say which Node runs the tests
        shell: bash
        run: |
          set -euo pipefail
          have=$(node -p 'process.versions.node')
          echo "node $have (pinned ${{ steps.pin.outputs.node }})"
          [ "$have" = "${{ steps.pin.outputs.node }}" ] || { echo "::error::the tests would run on Node $have, not the pinned ${{ steps.pin.outputs.node }}"; exit 1; }

      - name: pnpm test (host, protocol, launcher)
        shell: bash
        env:
          # Never the real data folder, on any OS (AGENTS.md)
          CC_DATA_DIR: ${{ runner.temp }}/centralu-data
        run: pnpm exec vitest run packages/agent-host packages/protocol tooling/launcher-

  host-tests-remote-node-skipped:
    name: host tests, remote Node (${{ matrix.runner }})
    needs: changes
    if: needs.changes.outputs.host_tests == 'false'
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        runner: [ubuntu-24.04, windows-2022]
    steps:
      - run: echo "Nothing these tests run changed (.github/scripts/ci-changes.mjs)"

  # The keeper end to end, with the real binary and the real host (2026-10-05). Neither the unit
  # tests nor e2e start a keeper: when #329 put an `await` in the host's startup before the server
  # existed, every host restart that held a terminal or a dev server crashed five times until the
  # keeper gave up, and everything stayed green. scripts/keeper-children-integration.mjs, run by
  # hand days later, was the first to notice (fixed in #348). These steps are the parts of the three
  # keeper scripts that need no model and no network; the claude and codex turns stay a manual run.
  #
  # macOS, because that is where the packaged app always uses the keeper and where its exit watch is
  # kqueue. The same image as the darwin bundle above. Linux (pidfd) is the `keeper-linux` job below.
  keeper:
    name: keeper e2e
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: macos-15
    timeout-minutes: 20
    env:
      # The scripts build into a folder under /tmp by default. rust-cache keeps only folders under
      # the workspace, so CI builds into the crate's own target folder and the scripts look there.
      KEEPER_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Never the real data folder (AGENTS.md). Every keeper the scripts start gets a temporary
      # folder of its own; this only covers anything that would otherwise fall back to the default.
      # A step, because the job's `env` cannot read the `runner` context.
      - name: Point CC_DATA_DIR at a temporary folder
        run: echo "CC_DATA_DIR=$RUNNER_TEMP/centralu-data" >> "$GITHUB_ENV"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # A debug build: it shares nothing with the darwin bundle's release cache.
          key: keeper-darwin-arm64

      - run: pnpm install --frozen-lockfile

      # Built once here rather than by each script (they all take --no-build), so the time a build
      # takes and the time the checks take are reported apart.
      - name: Bundle the host
        id: bundle
        run: pnpm bundle:host

      - name: Build the binary (debug)
        id: build
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

      # Each script runs whatever the one before said, so one failure does not hide the next.
      - name: keeper (start, attach, background, relaunch, stop, swap, drain, from a copy out of the AppImage)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.build.outcome == 'success' }}
        run: node scripts/keeper-integration.mjs --no-build

      - name: keeper holding a terminal and a dev server across a host crash
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.build.outcome == 'success' }}
        run: node scripts/keeper-children-integration.mjs --no-build --no-claude --no-codex

      - name: keeper handing itself over
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.build.outcome == 'success' }}
        run: node scripts/keeper-handoff-integration.mjs --no-build --no-claude --no-codex

      # The shell that holds macOS permissions (docs/plans/thin-shell.md §3). Here because this job
      # already has the workspace's debug dependencies built and cached: the shell's unit tests and
      # its two debug builds (one trusting a throwaway key) compile only the shell crate on top.
      # It is not a default member of the workspace, so `cargo build` above does not build it.
      - name: shell unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -p centralu-shell

      - name: shell (verify, copy, start the keeper from the copy, refusals)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm exec tsx scripts/shell-integration.mts

      # Thin shell step 5 (docs/plans/thin-shell.md §10.3): a keeper the shell started verifies the
      # next build's content before it hands over. Builds a test keeper and a test shell trusting a
      # throwaway key (the keeper crate and the shell only, on top of the build above), then puts the
      # plain debug keeper back in the target folder. About a minute on top of its builds.
      - name: keeper handing over to verified content (tampered and older content refused, cleanup)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.build.outcome == 'success' }}
        run: pnpm exec tsx scripts/keeper-content-integration.mts --no-build

  # The same keeper scripts on Linux (#350, 2026-10-08). A first trial here (2026-10-05) ended when
  # SIGTERM reached the script itself: the keeper stopped its host's group with
  # `/bin/kill -TERM -<pid>`, which procps-ng 4.0.4 (this image's) sends to the group named by the
  # pid's first digit, so a host pid starting with 1 signalled every process of the user. Now a
  # direct kill(2). Measured in WSL2 Ubuntu 24.04: docs/spikes/2026-10-linux-keeper.md.
  #
  # The keeper crate's unit tests run here too: `kill_group_signals_the_group_the_pid_leads_and_
  # nothing_else` only tells the two apart against Linux's `kill`, and nothing else runs them on
  # Linux. The window is built as well, because the handoff script starts it as an old keeper
  # would; that needs webkit2gtk's headers (the same list as the bundle job). No shell steps: the
  # shell is macOS's, though the content script builds and runs it here like any unix program.
  keeper-linux:
    name: keeper e2e (linux)
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      KEEPER_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Point CC_DATA_DIR at a temporary folder
        run: echo "CC_DATA_DIR=$RUNNER_TEMP/centralu-data" >> "$GITHUB_ENV"

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: keeper-linux-x64

      - run: pnpm install --frozen-lockfile

      - name: Bundle the host
        id: bundle
        run: pnpm bundle:host

      - name: Build the binary (debug)
        id: build
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: keeper crate unit tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml -p centralu-keeper-core --lib

      - name: keeper (start, attach, background, relaunch, stop, swap, drain, from a copy out of the AppImage)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.build.outcome == 'success' }}
        run: node scripts/keeper-integration.mjs --no-build

      - name: keeper holding a terminal and a dev server across a host crash
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.build.outcome == 'success' }}
        run: node scripts/keeper-children-integration.mjs --no-build --no-claude --no-codex

      - name: keeper handing itself over
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.build.outcome == 'success' }}
        run: node scripts/keeper-handoff-integration.mjs --no-build --no-claude --no-codex

      - name: keeper handing over to verified content (tampered and older content refused, cleanup)
        if: ${{ !cancelled() && steps.bundle.outcome == 'success' && steps.build.outcome == 'success' }}
        run: pnpm exec tsx scripts/keeper-content-integration.mts --no-build
