# Lowers the type-aware lint's allowlists to what the files hold, once a week (#1339).
#
# A line above what its file holds, or for a file that is gone, is not a lint failure
# (tooling/lint-allowlist.ts `lintFailed`): two changes that each fix one finding of a file
# would otherwise fail together in a queue batch, and a change that only fixes things would have
# to edit a list. No change can raise such a line again (tooling/type-aware-lint.test.ts compares
# the lists with main's), but until it is lowered it is slack in its file, so this job keeps the
# lists true.
#
# Two jobs, so that no code from the dependencies runs where a write token is (#1343 review):
#   tighten  reads only: installs, runs `pnpm lint:tighten`, and hands the lists on as an artifact.
#            Its checkout keeps no token.
#   open     writes only: no install, no repository code run; it puts the lists on a fresh
#            checkout of main and pushes them to one branch, `lint-tighten/weekly`, opening its pull
#            request only when none is open (a week not yet landed is updated, not doubled).
# A pull request a workflow opens with its own token runs no workflows itself, so whoever queues it
# starts its CI (an empty commit, or `gh workflow run build.yml --ref lint-tighten/weekly`). Opening
# it needs the repository setting "Allow GitHub Actions to create and approve pull requests".
name: lint tighten

on:
  schedule:
    # Monday 20:41 UTC, off the hour (GitHub's high-load times), before drift.yml's run
    - cron: '41 20 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-tighten
  cancel-in-progress: false

jobs:
  tighten:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile

      # Lowers the lines whatever findings main has (exit 1: the queue's to answer, said in this log), but a
      # crash (exit 2: an unreadable list, a config error) fails the job instead of opening nothing for ever
      - name: Lower the lists
        run: |
          rc=0
          pnpm lint:tighten || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "pnpm lint:tighten crashed (exit $rc)"
            exit "$rc"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-allowlist
          path: tooling/lint-allowlist/*.txt
          if-no-files-found: error
          retention-days: 7

  open:
    needs: tighten
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Only git and gh run here: nothing installed, nothing from the repository executed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the lowered lists
        run: rm -f tooling/lint-allowlist/*.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lint-allowlist
          path: tooling/lint-allowlist

      - name: Push them, and open the pull request if none is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- tooling/lint-allowlist)" ]; then
            echo "Every line holds what its file holds; nothing to push."
            exit 0
          fi
          branch='lint-tighten/weekly'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add -A -- tooling/lint-allowlist
          git commit -m 'chore(lint): lower the lint allowlists to what the files hold' -m 'Refs: #1339'
          git push --force origin "$branch"
          open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "Updated the open pull request #$open."
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title 'chore(lint): lower the lint allowlists to what the files hold' \
            --body "$(printf '%s\n' \
              '## Why' '' 'The weekly lint tighten (.github/workflows/lint-tighten.yml, #1339): lines that listed more findings than their files hold, or files that are gone.' '' \
              '## What changed' '' 'Only `tooling/lint-allowlist/*.txt`, lowered or removed; nothing raised or added. A later week updates this pull request while it is open.' '' \
              '## Verified' '' "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Its CI does not start by itself (a workflow's own token): start it when queueing." '' \
              '## Situations checked' '' 'n/a' '' '## Usability' '' 'n/a' '' '## Not exercised' '' 'Nothing beyond the lint run above.' '' '## Closes' '' 'Refs #1339')"
