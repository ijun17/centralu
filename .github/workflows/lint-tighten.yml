# Lowers the type-aware lint's allowlists to what the files hold, once a week (#1339).
#
# A line above what its file holds, or for a file that is gone, is not a lint failure
# (tooling/lint-allowlist.ts `lintFailed`): two changes that each fix one finding of a file
# would otherwise fail together in a queue batch, and a change that only fixes things would have
# to edit a list. No change can raise such a line again (tooling/type-aware-lint.test.ts compares
# the lists with main's), but until it is lowered it is slack in its file, so this job keeps the
# lists true.
#
# Two jobs, so that no code from the dependencies runs where a write token is (#1343 review):
#   tighten  reads only: installs, runs `pnpm lint:tighten`, and hands the lists on as an artifact.
#            Its checkout keeps no token.
#   open     writes only: no install, no repository code run; it puts the lists on a fresh
#            checkout of main and pushes them to one branch, `lint-tighten/weekly` (a week not yet landed is
#            updated, not doubled). It opens no pull request: the repository does not let GITHUB_TOKEN do that
#            (#1983), and allowing it would widen the token. The job summary names the branch and the
#            `gh pr create` line for a person to run.
# A pull request opened by hand from that branch runs its CI as any other.
name: lint tighten

on:
  schedule:
    # Monday 20:41 UTC, off the hour (GitHub's high-load times), before drift.yml's run
    - cron: '41 20 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: lint-tighten
  cancel-in-progress: false

jobs:
  tighten:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile

      # Lowers the lines whatever findings main has (exit 1: the queue's to answer, said in this log), but a
      # crash (exit 2: an unreadable list, a config error) fails the job instead of opening nothing for ever
      - name: Lower the lists
        run: |
          rc=0
          pnpm lint:tighten || rc=$?
          if [ "$rc" -gt 1 ]; then
            echo "pnpm lint:tighten crashed (exit $rc)"
            exit "$rc"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-allowlist
          path: tooling/lint-allowlist/*.txt
          if-no-files-found: error
          retention-days: 7

  open:
    needs: tighten
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only git runs here: nothing installed, nothing from the repository executed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Take the lowered lists
        run: rm -f tooling/lint-allowlist/*.txt

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: lint-allowlist
          path: tooling/lint-allowlist

      - name: Push them, and say how to open the pull request
        run: |
          if [ -z "$(git status --porcelain -- tooling/lint-allowlist)" ]; then
            echo "::notice::Every line holds what its file holds; nothing pushed."
            echo "Every line holds what its file holds; nothing pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch='lint-tighten/weekly'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add -A -- tooling/lint-allowlist
          git commit -m 'chore(lint): lower the lint allowlists to what the files hold' -m 'Refs: #1339'
          git push --force origin "$branch"
          title='chore(lint): lower the lint allowlists to what the files hold'
          # The pull request template's sections; nothing here has a single quote, as the line below quotes it
          body=$(printf '%s\n' \
            '## Why' '' 'The weekly lint tighten (.github/workflows/lint-tighten.yml, #1339): lines that listed more findings than their files hold, or files that are gone.' '' \
            '## What changed' '' 'Only tooling/lint-allowlist/*.txt, lowered or removed; nothing raised or added. A later week updates this pull request while it is open.' '' \
            '## Verified' '' "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}." '' \
            '## Situations checked' '' 'n/a' '' '## Usability' '' 'n/a' '' '## Not exercised' '' 'Nothing beyond the lint run above.' '' '## Closes' '' 'Refs #1339')
          {
            echo "### Lowered lists pushed to \`$branch\`"
            echo
            echo "This workflow opens no pull request: the repository does not let it create one. If one is already open for this branch, the push updated it. Otherwise open it with this line:"
            echo
            echo '```sh'
            echo "gh pr create --base main --head $branch --title '$title' --body '$body'"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Pushed $branch. If no pull request is open for it: gh pr create --base main --head $branch"
