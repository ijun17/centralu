# Publishes a Linux platform npm package (`centralu-linux-x64`, and — once #29 is
# actually enabled, see docs/releasing.md — `centralu-linux-arm64`).
#
# **Superseded by `release.yml`**, which publishes every platform *and* the shim from one
# tag push, in the order the shim's exact-version pins require. This file stays until that
# workflow has done one real release: it is the path 0.1.0-beta.2 actually shipped through,
# and deleting a proven one before its replacement has ever shipped anything trades a
# working thing for an untested one. Delete it after that release — the checklist is in
# docs/releasing.md.
#
# Why this is a workflow and not something a person runs (#14): scripts/release-npm.mts
# refuses to package a bundle it did not build on the target platform, because every one
# of its checks reads a real artifact. Nobody here has a Linux machine of either
# architecture, so this runner is the only host that can produce and verify either
# package.
#
# Deliberate limits:
#   * `workflow_dispatch` only. Nothing here fires on a push, a tag, or a merge. Publishing
#     is not reversible (npm blocks unpublish after 24h), so it stays a decision someone
#     makes out loud. That same "a human has to choose this" property is why the `target`
#     input below is safe to offer even for an architecture with an unpublished package
#     and a runner nothing has ever built on (#29) — nothing here can select itself.
#   * Dry run by default. You have to turn it off on purpose.
#   * This never publishes the `centralu` shim. The shim pins its platform packages to an
#     exact version and may only go out once all of them are up, so it is published last,
#     by hand, from a Mac: `pnpm release:npm --publish`.
name: publish-linux-npm

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Which platform package to build and publish'
        type: choice
        options:
          - linux-x64
          - linux-arm64
        default: linux-x64
      dry_run:
        description: 'Rehearse only (npm pack, no publish)'
        type: boolean
        default: true
      also_latest:
        description: 'Also move the `latest` dist-tag to this version (only while no stable release exists)'
        type: boolean
        default: false

jobs:
  publish:
    # Must stay the same distro floor as .github/workflows/build.yml — see the pin
    # rationale there. What is published has to be built against the same glibc floor
    # that CI tests. `ubuntu-22.04-arm` is the arm64 GitHub-hosted image at that same
    # floor (https://github.blog/changelog/2025-08-07-arm64-hosted-runners-for-public-repositories-are-now-generally-available/,
    # confirmed still current 2026-01-29 when private-repo support arrived,
    # https://github.blog/changelog/2026-01-29-arm64-standard-runners-are-now-available-in-private-repositories/)
    # — not a cross-build, an actually-different runner. The `&&`/`||` below looks like
    # the ternary the release script's own comment warns against, but that warning is
    # about a *falsy* right-hand value (an empty string reads as "false" and silently
    # takes the other branch); both branches here are non-empty runner-label strings, so
    # there is no such trap.
    runs-on: ${{ inputs.target == 'linux-arm64' && 'ubuntu-22.04-arm' || 'ubuntu-22.04' }}
    # The gate that actually stops an accidental publish. Give this environment a required
    # reviewer in repo settings and hold NPM_TOKEN here, not at repo level, so the token is
    # unreachable from any other workflow.
    # The gate exists for publishing — a rehearsal is `npm pack`, needs no token,
    # and gating it costs a human approval per attempt (three were spent on the
    # first release's failing rehearsals before this line learned that).
    # An expression that evaluates to '' means "no environment" to GitHub.
    environment: ${{ inputs.dry_run == false && 'npm-publish' || '' }}

    steps:
      - uses: actions/checkout@v4

      # Same list and the same reasons as .github/workflows/build.yml — kept in step with it.
      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          # Writes an .npmrc outside the checkout and points npm at it. That matters here:
          # release-npm.mts aborts on a dirty working tree, and an .npmrc dropped into the
          # repo would trip that check — and would be a credential sitting in the workspace.
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # The cache is only valid per platform (matches the key build.yml uses per
          # matrix entry); a shared key would let an x64 and an arm64 cache collide.
          key: ${{ inputs.target }}

      - run: pnpm install --frozen-lockfile

      - name: Release
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Must be an npm *automation* token. A publish token of the classic kind still
          # prompts for a 2FA code, and there is nobody here to type it — the run would
          # just hang until it times out.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # The arguments are assembled in the shell rather than with `${{ a && b || c }}`.
        # That expression is not a ternary: it falls through to `c` whenever `b` is falsy,
        # and an empty string is falsy — so the "leave the flag off" branch would have
        # produced `--publish`. Wrong in the one direction that cannot be undone.
        run: |
          args="--platform-only"
          # Matched against "false", not against "not true": an empty or unexpected value
          # then rehearses instead of publishing. Both wrong answers exist, only one of
          # them is reversible.
          if [ "${{ inputs.dry_run }}" = "false" ]; then args="$args --publish"; fi
          if [ "${{ inputs.also_latest }}" = "true" ]; then args="$args --also-latest"; fi
          echo "pnpm release:npm $args"
          pnpm release:npm $args

      # Keep the exact artifact that was packaged, so a later "what did we actually ship"
      # question has an answer that is not a rebuild.
      - uses: actions/upload-artifact@v4
        with:
          name: centralu-${{ inputs.target }}-published
          path: packaging/npm/${{ inputs.target }}/*.AppImage
          if-no-files-found: error
