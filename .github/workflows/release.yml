# Publishes a whole release — both platform packages and the `centralu` shim — from one
# `git push --tags`.
#
# Why this exists: 0.1.0-beta.2 went out by hand, in three places, in an order a person had
# to remember (Linux from a since-removed `publish-linux-npm.yml`, then macOS from a Mac, then the shim from
# the same Mac). The order is not a preference — the shim pins its platform packages to an
# *exact* version, so it may only go out once every one of them is already on the registry.
# A human keeping that straight across three sessions is a mistake waiting for a bad day,
# and npm blocks unpublish after 24h.
#
# The job graph encodes the order instead:
#
#     guard ──┬── platform (linux-x64)   ──┐
#             ├── platform (linux-arm64) ──┤
#             ├── platform (darwin-arm64) ─┤
#             └── platform (win32-x64)   ──┴── shim
#
# `needs: platform` on a matrix job means *every* entry succeeded, so the shim cannot go out
# while any platform is missing — and that stays true the day linux-arm64 joins the matrix
# without anyone remembering to update this.
#
# The Linux and Windows jobs publish two packages each: the host alone (`@centralu/host-<target>`,
# what a hub installs on a remote, docs/releasing.md "Host-only packages") and then the platform
# package. A job that fails halfway is finished by re-running it: `release-npm.mts` skips a package
# that an earlier attempt from this same commit already published (docs/releasing.md "When a job
# fails halfway").
#
# Two things are deliberate about the triggers:
#
#   * A tag push is a real release. That is the whole point: the tag is the one place a human
#     states "this one, now". brand.ts carries no version (the tag scheme, #1501): the tag is the
#     version, and `guard` holds it to the previous release (scripts/release-guard.mjs).
#     A manual run never publishes, whatever `dry_run` says.
#   * `workflow_dispatch` exists to rehearse (`dry_run`, default true). The darwin release
#     path has only ever run on the developer's Mac; the Linux one had never run anywhere
#     until it did, and its first run found two mac-only assumptions in `pnpm verify`. The
#     first run of *this* workflow must be able to be a rehearsal, not a release.
name: release
# A rehearsal names the version it builds, so the board can tell which version a rehearsal was of
# (the tag scheme, #1501: the tree no longer carries one). A tag push is named by its tag.
run-name: ${{ github.event_name == 'workflow_dispatch' && format('rehearse {0}', inputs.version || 'next') || github.ref_name }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Rehearse only (build + npm pack, no publish, no approval asked)'
        type: boolean
        default: true
      also_latest:
        description: 'Also move the `latest` dist-tag to this version (correct only while no stable release exists — drop at 1.0)'
        type: boolean
        default: true
      version:
        description: 'The version to rehearse (empty: the next prerelease after the newest tag).'
        type: string
        required: false
        default: ''

# Never cancel a release in flight. `build.yml` cancels freely because a newer push makes an
# older build irrelevant; here a cancelled job could be one that has already put a package on
# the registry, and there is no taking that back.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing here writes to the repository. The npm credential lives in the `npm-publish`
# environment, not in this token.
permissions:
  contents: read

jobs:
  # Everything after this is expensive (a Rust release build per platform) and ends in
  # something that cannot be undone. This job is neither, so it runs first and alone: when
  # the tag and the version in the repo disagree, nothing has been built and nothing has
  # been published.
  guard:
    name: check the tag against the repo
    runs-on: ubuntu-24.04
    # actions: read for the rehearsal check below (the runs of this workflow); nothing is written
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      # Strings, not booleans — a job output is always a string. Every consumer below
      # compares against the literal "false"/"true" for that reason.
      dry_run: ${{ steps.plan.outputs.dry_run }}
      also_latest: ${{ steps.plan.outputs.also_latest }}
      # "brand" while brand.ts declares the version, "tag" once the tag alone does (#1501)
      scheme: ${{ steps.plan.outputs.scheme }}
      # "true" only on a tag push whose tree a successful rehearsal built and verified (#1042)
      skip_verify: ${{ steps.rehearsal.outputs.skip_verify }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The history and the tags: under the tag scheme the guard checks that the previous release
          # tag is an ancestor of this commit and that the commit is on main (#1501). Without them a
          # tag pushed by hand on an older commit would ship without the previous release's changes.
          fetch-depth: 0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      # Which version this run builds, and whether it publishes: scripts/release-guard.mjs. The inputs go through the environment instead
      # of pasting `${{ inputs.* }}` into a script: an expression is substituted before anything
      # parses the line, so a value carrying a quote would be executed rather than compared.
      - id: plan
        env:
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_ALSO_LATEST: ${{ inputs.also_latest }}
          INPUT_VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/release-guard.mjs

      # The Node a remote runs (docs/plans/remote-hub.md §10.3). Every platform package carries
      # packaging/remote-runtime.json in its host, and a hub sends the remote the hash for its
      # platform from there. Checked here, before anything is built, against nodejs.org's
      # SHASUMS256.txt and its signature by the releaser the pin names (key from nodejs/release-keys
      # at the pinned commit). Node's own modules and `gpgv`, which ubuntu images carry, so no install.
      - name: Check the pinned Node against its signed SHASUMS256.txt
        run: node scripts/node-pin.mjs

      # `pnpm verify` ran in every platform job and the shim of a tagged run, about 13 minutes,
      # after the rehearsal had verified the same files on the same runners (#1042, owner decision
      # 2026-10-18). The rehearsal stays where verify runs on macOS, ubuntu-22.04 and arm64; a tag
      # push skips it only when GitHub lists a successful rehearsal (a workflow_dispatch run of this
      # workflow) on a commit with the tagged commit's tree. Asked here, through the API, so a tag
      # pushed by hand skips nothing it has not earned. A rehearsal never skips: only a tag push asks.
      - name: Find a successful rehearsal on this tree
        id: rehearsal
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release-rehearsal.mjs

  # One job per platform package, each building on the platform it ships to. A target a hub
  # installs on (one `packaging/remote-runtime.json` pins a Node for) also publishes its host-only
  # package, first, from the same build; tooling/release-workflow.test.ts holds the two lists together.
  #
  # `scripts/release-npm.mts` has no cross-build switch on purpose: every check it runs
  # interrogates a real artifact (code signature, exec bit, machine type per `file`), and
  # none of those questions can be answered honestly about a Linux binary from a Mac. So
  # "which machine" is not a detail of this matrix, it is the reason there is one.
  platform:
    name: ${{ matrix.target }}
    needs: guard
    runs-on: ${{ matrix.runner }}
    strategy:
      # A failure on one platform must not cancel the other mid-`npm publish`. The ordering
      # is enforced by the shim job's `needs`, which requires *both* to have succeeded —
      # letting a running publish finish is strictly safer than interrupting it.
      fail-fast: false
      matrix:
        include:
          # Same distro floor as .github/workflows/build.yml — see the pin rationale there.
          # What gets published has to be built against the same glibc floor CI tests.
          - target: linux-x64
            runner: ubuntu-22.04
          # Pinned for the same reason `build.yml` pins it: `macos-latest` moves between
          # Xcode and SDK versions without warning, and a release is not where to find out.
          # macos-15 since GitHub retires the macOS 14 images on 2026-11-02 (runner-images#13518); the build below
          # still targets macOS 11.0, as it did on macos-14.
          - target: darwin-arm64
            runner: macos-15
          # linux-arm64 (#29), on from 0.1.0-beta.3. `ubuntu-22.04-arm` is deliberately the
          # same distro version as the x64 pin above, so arm64 users get the same glibc floor
          # rather than a newer one — and the runner is free only while this repository is
          # public (see docs/releasing.md → "linux-arm64 (#29)" before flipping it private).
          - target: linux-arm64
            runner: ubuntu-22.04-arm
          # Windows x64 (#14, W3). Pinned to the same image as `build.yml`'s windows-x64 job,
          # for the same reason: `windows-latest` moves to a new Visual Studio and Windows SDK
          # without warning. Named `win32-x64` here, not `windows-x64` as in build.yml, because
          # this name is the npm package suffix and the host id release-npm.mts derives from
          # Node's `process.platform` — and Node calls Windows `win32`.
          - target: win32-x64
            runner: windows-2022
    # The gate that actually stops an accidental publish: a required reviewer on the
    # `npm-publish` environment, holding NPM_TOKEN there rather than at repo level so no
    # other workflow can reach it. It earned its keep on the first release, catching an
    # EOTP failure before anything shipped.
    #
    # A rehearsal is `npm pack`. It needs no token, and gating it costs a human approval
    # per attempt — three were spent on failing rehearsals before `c7e3864` learned that.
    # An expression evaluating to '' means "no environment" to GitHub.
    environment: ${{ needs.guard.outputs.dry_run == 'false' && 'npm-publish' || '' }}
    # The version the guard decided, for every step of the job, `pnpm install` included (#1501,
    # review item 7). The tag scheme's stamp reads it.
    env:
      CENTRALU_VERSION: ${{ needs.guard.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same list and the same reasons as .github/workflows/build.yml — kept in step with it.
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libfuse2

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          # Writes an .npmrc outside the checkout and points npm at it. That matters here:
          # release-npm.mts aborts on a dirty working tree, and an .npmrc dropped into the
          # repo would trip that check — and would be a credential sitting in the workspace.
          registry-url: https://registry.npmjs.org

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - uses: swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          # Only valid per platform; a shared key would let two architectures collide. The runner image is in it
          # too, as in build.yml: a runner move rebuilds the dependencies.
          key: ${{ matrix.target }}-${{ matrix.runner }}

      - run: pnpm install --frozen-lockfile

      - name: Build, verify and publish the platform package
        env:
          # linuxdeploy and appimagetool are AppImages and mount via FUSE, which runners can
          # refuse — with a bare "failed to run linuxdeploy" that never mentions FUSE. Unused
          # on macOS, harmless there.
          APPIMAGE_EXTRACT_AND_RUN: 1
          # Must be a granular token with **Bypass 2FA** (what the npm UI used to call an
          # automation token). A publish-type token still demands an OTP, and a workflow has
          # nobody to type it — the first release found this as a bare `EOTP` (#29).
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ needs.guard.outputs.dry_run }}
          ALSO_LATEST: ${{ needs.guard.outputs.also_latest }}
          SKIP_VERIFY: ${{ needs.guard.outputs.skip_verify }}
          TARGET: ${{ matrix.target }}
          # The oldest macOS the app runs on, as build.yml's macOS build states it. release-npm.mts checks every Mach-O
          # file in the staged package against it (scripts/macos-minos.mjs).
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.target == 'darwin-arm64' && '11.0' || '' }}
          # pnpm verify's styles.test.ts: main's bundle comparison is build.yml's verify job's (#1181)
          CC_BUNDLE_COMPARED_BY: build.yml verify
          # The content signing key (docs/plans/thin-shell.md §4), PKCS#8 PEM. An environment
          # secret of `npm-publish`, so it exists only in a publishing run, behind the same
          # approval as NPM_TOKEN; a rehearsal has no environment and signs with a throwaway key.
          # Only the job that writes a manifest gets it. release-npm.mts takes it out of its own
          # environment before it starts anything.
          CONTENT_SIGNING_KEY: ${{ matrix.target == 'darwin-arm64' && secrets.CONTENT_SIGNING_KEY || '' }}
        # The arguments are assembled in the shell rather than with `${{ a && b || c }}`.
        # That expression is not a ternary: it falls through to `c` whenever `b` is falsy,
        # and an empty string is falsy — so the "leave the flag off" branch would have
        # produced `--publish`. Wrong in the one direction that cannot be undone.
        #
        # bash on every runner, Windows included (Git Bash is on the image), so this one
        # script is the publish logic everywhere. Without it Windows would run PowerShell,
        # which reads `set -euo pipefail` as an error and the `if` lines as nothing at all.
        shell: bash
        run: |
          set -euo pipefail
          args="--platform-only"
          # Matched against "false", not against "not true": an empty or unexpected value
          # then rehearses instead of publishing.
          if [ "$DRY_RUN" = "false" ]; then args="$args --publish"; fi
          if [ "$ALSO_LATEST" = "true" ]; then args="$args --also-latest"; fi
          # A publish that writes a content manifest must sign it with a key in
          # packaging/shell/keys.json, and finds out before anything reaches the registry.
          if [ "$DRY_RUN" = "false" ] && [ "$TARGET" = "darwin-arm64" ]; then args="$args --require-content-key"; fi
          # Matched against "true": anything else verifies
          if [ "$SKIP_VERIFY" = "true" ]; then args="$args --skip-verify"; fi
          echo "pnpm release:npm $args"
          pnpm release:npm $args

      # The signed manifest and its signature (not the files, which are the host already in the
      # package), so the shell's step can be tried against what a release really wrote. After the
      # publish, so it must never fail the job: a red platform job holds back the shim.
      - name: Keep the content manifest
        if: matrix.target == 'darwin-arm64'
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: content-manifest-${{ matrix.target }}
          path: |
            apps/desktop/src-tauri/target/release/content/content-manifest.json
            apps/desktop/src-tauri/target/release/content/content-manifest.json.sig
          if-no-files-found: warn

  # The shim last, and only if every platform package above went out.
  #
  # `centralu` is a launcher script and nothing else — no bundle, no native code — so this
  # is the one job with no platform requirement, and `--shim-only` is the mode that says so.
  # The script still refuses to publish it while any pinned platform package (or host-only
  # package) is missing from the registry at this version, after waiting up to ten minutes for
  # packages published moments ago to show there; `needs` makes that check a formality rather
  # than the last line of defence, which is the right order for the two to be in.
  shim:
    name: centralu (shim)
    needs: [guard, platform]
    # No Tauri build happens here, so none of the webkit/AppImage system packages apply.
    # Kept at the same 22.04 image as the Linux platform job anyway: this is the only host
    # where `pnpm verify` has ever run on Linux, and this job runs *after* two irreversible
    # publishes — the wrong place to be the first to try a newer image.
    runs-on: ubuntu-22.04
    environment: ${{ needs.guard.outputs.dry_run == 'false' && 'npm-publish' || '' }}
    env:
      CENTRALU_VERSION: ${{ needs.guard.outputs.version }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Publish the shim
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          DRY_RUN: ${{ needs.guard.outputs.dry_run }}
          ALSO_LATEST: ${{ needs.guard.outputs.also_latest }}
          SKIP_VERIFY: ${{ needs.guard.outputs.skip_verify }}
          # pnpm verify's styles.test.ts: main's bundle comparison is build.yml's verify job's (#1181)
          CC_BUNDLE_COMPARED_BY: build.yml verify
        # In a rehearsal this prints a yellow warning that the platform packages are not on
        # the registry at this version, and carries on. That is the truth: the rehearsal
        # published none of them.
        run: |
          set -euo pipefail
          args="--shim-only"
          if [ "$DRY_RUN" = "false" ]; then args="$args --publish"; fi
          if [ "$ALSO_LATEST" = "true" ]; then args="$args --also-latest"; fi
          if [ "$SKIP_VERIFY" = "true" ]; then args="$args --skip-verify"; fi
          echo "pnpm release:npm $args"
          pnpm release:npm $args

      - name: Say where it landed
        if: needs.guard.outputs.dry_run == 'false'
        env:
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          {
            echo "### Published"
            echo
            echo '```'
            echo "npm i -g centralu@$VERSION"
            echo '```'
            echo
            echo "Verify from a machine that has never had it: install, run \`centralu\`, and check the version in the window."
          } >> "$GITHUB_STEP_SUMMARY"
