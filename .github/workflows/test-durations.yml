# Refreshes tooling/test-durations.json once a week, so the Windows shards stay balanced.
#
# build.yml splits the Windows unit tests into two shards by each file's measured time. The times go stale as
# tests change (a file that took 72 s took 369 s weeks later, one shard ran 2567 s against 1769 s), and refreshing
# them by hand (`tsx tooling/os-tests.ts --refresh-durations`) was forgotten. The Windows shards upload their vitest
# JSON report as `windows-test-times-<shard>`; this takes those of the newest green push run of build.yml on main
# that still has them.
#
# That run is often behind main (a push run is cancelled by the next landing). So the file written holds exactly the
# test files of this checkout (`refreshDurations` in tooling/os-tests.ts): a time of the run for a file it timed, the
# current entry for one it did not, the median for a new one, nothing for a file that is gone. The summary says how
# far behind main the run is.
#
# Two jobs, as lint-tighten.yml: no code from the dependencies runs where a write token is.
#   refresh  reads only: downloads the two reports, runs the refresh, hands the file on as an artifact.
#   open     writes only: no install; puts the file on a fresh checkout of main and pushes it to one branch,
#            `test-durations/weekly`. It opens no pull request: the repository does not let GITHUB_TOKEN do that
#            (#1983), and allowing it would widen the token. The job summary names the branch and the `gh pr create`
#            line for a person to run.
name: test durations

on:
  schedule:
    # Tuesday 03:17 UTC, off the hour (GitHub's high-load times)
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-durations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      run: ${{ steps.times.outputs.run }}
      behind: ${{ steps.times.outputs.behind }}
      age_days: ${{ steps.times.outputs.age_days }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile

      # The newest green push run of build.yml on main that still has both reports (artifacts last 30 days)
      - name: Download the Windows test times
        id: times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/times"
          gh run list --workflow build.yml --branch main --event push --status success --limit 30 --json databaseId,headSha,createdAt > "$RUNNER_TEMP/runs.json"
          for run in $(jq -r '.[].databaseId' "$RUNNER_TEMP/runs.json"); do
            rm -rf "$RUNNER_TEMP/times"/*
            if gh run download "$run" -n windows-test-times-1 -D "$RUNNER_TEMP/times/1" && gh run download "$run" -n windows-test-times-2 -D "$RUNNER_TEMP/times/2"; then
              sha=$(jq -r --argjson run "$run" '.[] | select(.databaseId == $run) | .headSha' "$RUNNER_TEMP/runs.json")
              created=$(jq -r --argjson run "$run" '.[] | select(.databaseId == $run) | .createdAt' "$RUNNER_TEMP/runs.json")
              # How many commits main has that the run's head has not; the run's age in days
              behind=$(gh api "repos/$GITHUB_REPOSITORY/compare/$sha...$GITHUB_SHA" --jq '.ahead_by' 2>/dev/null || true)
              # An error body goes to stdout too: anything but a number is unknown
              [[ "$behind" =~ ^[0-9]+$ ]] || behind=unknown
              age_days=$(( ($(date +%s) - $(date -d "$created" +%s)) / 86400 ))
              echo "Times of run $run, $behind commits and $age_days days behind this checkout."
              {
                echo "run=$run"
                echo "behind=$behind"
                echo "age_days=$age_days"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No green main run with both reports."
          exit 1

      - name: Refresh the file
        run: pnpm exec tsx tooling/os-tests.ts --refresh-durations "$RUNNER_TEMP/times/1/vitest-times.json" "$RUNNER_TEMP/times/2/vitest-times.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations
          path: tooling/test-durations.json
          if-no-files-found: error
          retention-days: 7

  open:
    needs: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Only git runs here: nothing installed, nothing from the repository executed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-durations
          path: tooling

      - name: Push it, and say how to open the pull request
        env:
          RUN: ${{ needs.refresh.outputs.run }}
          BEHIND: ${{ needs.refresh.outputs.behind }}
          AGE_DAYS: ${{ needs.refresh.outputs.age_days }}
        run: |
          if [ -z "$(git status --porcelain -- tooling/test-durations.json)" ]; then
            echo "::notice::The times are as fresh as the latest run; nothing pushed."
            echo "The times are as fresh as the newest green run (${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN}); nothing pushed." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch='test-durations/weekly'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add -- tooling/test-durations.json
          git commit -m 'chore(test): refresh the Windows shard times'
          git push --force origin "$branch"
          behind="the run is ${BEHIND} commits and ${AGE_DAYS} days behind main"
          if [ "$BEHIND" = unknown ] || [ "$BEHIND" -gt 20 ] || [ "$AGE_DAYS" -gt 7 ]; then
            behind="WARNING: $behind (more than 20 commits or 7 days), so its times may be old"
          fi
          title='chore(test): refresh the Windows shard times'
          # The pull request template's sections; nothing here has a single quote, as the line below quotes it
          body=$(printf '%s\n' \
            '## Why' '' 'The weekly refresh of tooling/test-durations.json (.github/workflows/test-durations.yml): the Windows shards are split by these times.' '' \
            '## What changed' '' "Only tooling/test-durations.json, from the windows-test-times reports of ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN}; ${behind}. It holds the test files of this checkout only: a file the run did not time keeps its entry or gets the median, a deleted file is dropped." '' \
            '## Verified' '' "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Its CI does not start by itself (a workflow token): start it when queueing." '' \
            '## Situations checked' '' 'n/a' '' '## Usability' '' 'n/a' '' '## Not exercised' '' 'Nothing beyond the refresh run above.' '' '## Closes' '' 'n/a')
          {
            echo "### Times pushed to \`$branch\`"
            echo
            echo "No pull request is open: the repository does not let this workflow create one. Open it with this line, and start its CI when queueing:"
            echo
            echo '```sh'
            echo "gh pr create --base main --head $branch --title '$title' --body '$body'"
            echo '```'
            echo
            echo "Source run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN} ($behind)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Pushed $branch. Open its pull request: gh pr create --base main --head $branch (${behind})."
