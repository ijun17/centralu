# Refreshes tooling/test-durations.json once a week, so the Windows shards stay balanced.
#
# build.yml splits the Windows unit tests into two shards by each file's measured time. The times go stale as
# tests change (a file that took 72 s took 369 s weeks later, one shard ran 2567 s against 1769 s), and refreshing
# them by hand (`tsx tooling/os-tests.ts --refresh-durations`) was forgotten. The Windows shards upload their vitest
# JSON report as `windows-test-times-<shard>`; this takes those of the latest green push run of build.yml on main.
#
# Two jobs, as lint-tighten.yml: no code from the dependencies runs where a write token is.
#   refresh  reads only: downloads the two reports, runs the refresh, hands the file on as an artifact.
#   open     writes only: no install; puts the file on a fresh checkout of main and pushes it to one branch,
#            `test-durations/weekly`, opening its pull request only when none is open.
# A pull request a workflow opens with its own token runs no workflows itself: start its CI when queueing.
name: test durations

on:
  schedule:
    # Tuesday 03:17 UTC, off the hour (GitHub's high-load times)
    - cron: '17 3 * * 2'
  workflow_dispatch:

permissions: {}

concurrency:
  group: test-durations
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm install --frozen-lockfile

      # The latest green push run of build.yml on main that still has both reports (artifacts last 30 days)
      - name: Download the Windows test times
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/times"
          for run in $(gh run list --workflow build.yml --branch main --event push --status success --limit 30 --json databaseId --jq '.[].databaseId'); do
            rm -rf "$RUNNER_TEMP/times"/*
            if gh run download "$run" -n windows-test-times-1 -D "$RUNNER_TEMP/times/1" && gh run download "$run" -n windows-test-times-2 -D "$RUNNER_TEMP/times/2"; then
              echo "Times of run $run."
              echo "$run" > "$RUNNER_TEMP/times/run"
              exit 0
            fi
          done
          echo "No green main run with both reports."
          exit 1

      - name: Refresh the file
        run: pnpm exec tsx tooling/os-tests.ts --refresh-durations "$RUNNER_TEMP/times/1/vitest-times.json" "$RUNNER_TEMP/times/2/vitest-times.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-durations
          path: tooling/test-durations.json
          if-no-files-found: error
          retention-days: 7

  open:
    needs: refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Only git and gh run here: nothing installed, nothing from the repository executed
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: test-durations
          path: tooling

      - name: Push it, and open the pull request if none is open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain -- tooling/test-durations.json)" ]; then
            echo "The times are as fresh as the latest run; nothing to push."
            exit 0
          fi
          branch='test-durations/weekly'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git switch -C "$branch"
          git add -- tooling/test-durations.json
          git commit -m 'chore(test): refresh the Windows shard times'
          git push --force origin "$branch"
          open=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            echo "Updated the open pull request #$open."
            exit 0
          fi
          gh pr create --base main --head "$branch" \
            --title 'chore(test): refresh the Windows shard times' \
            --body "$(printf '%s\n' \
              '## Why' '' 'The weekly refresh of tooling/test-durations.json (.github/workflows/test-durations.yml): the Windows shards are split by these times.' '' \
              '## What changed' '' 'Only `tooling/test-durations.json`, from the `windows-test-times-*` reports of the latest green main run. A later week updates this pull request while it is open.' '' \
              '## Verified' '' "Run ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}. Its CI does not start by itself (a workflow's own token): start it when queueing." '' \
              '## Situations checked' '' 'n/a' '' '## Usability' '' 'n/a' '' '## Not exercised' '' 'Nothing beyond the refresh run above.' '' '## Closes' '' 'n/a')"
