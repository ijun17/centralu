<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>{{APP_NAME}}</title>
    <style>
      body {
        margin: 16px;
        font: 14px var(--font-sans, system-ui, sans-serif);
        color: var(--color-text-primary, #e8e8e8);
        background: transparent;
      }
      .count { font-size: 32px; font-variant-numeric: tabular-nums; margin-bottom: 12px; }
      button {
        font: inherit;
        color: inherit;
        background: var(--color-background-tertiary, #2a2a2a);
        border: 1px solid var(--color-border-primary, #3a3a3a);
        border-radius: 6px;
        padding: 4px 12px;
        cursor: pointer;
      }
      .error { color: #e06c6c; margin-top: 8px; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <div class="count" id="count">…</div>
    <button id="increment">+1</button>
    <button id="reset">Reset</button>
    <div class="error" id="error"></div>

    <!-- Centralu replaces this tag with the MCP App bridge (runtime/mcp-app.js). Keep it. -->
    <script src="centralu:mcp-app.js"></script>
    <script>
      // The screen holds no state of its own: it shows what the server says, and asks again when
      // Centralu says the app's state changed (someone — the person or an agent — called a tool).
      const app = new McpApp.App({ name: '{{APP_ID}}', version: '0.1.0' })
      const $ = (id) => document.getElementById(id)

      function show(result) {
        $('error').textContent = result?.isError ? (result.content ?? []).map((c) => c.text ?? '').join('\n') : ''
        const count = result?.structuredContent?.count
        if (count !== undefined) $('count').textContent = String(count)
      }
      async function call(name, args = {}) {
        try {
          show(await app.callServerTool({ name, arguments: args }))
        } catch (e) {
          $('error').textContent = String(e?.message ?? e)
        }
      }
      const reread = () => call('show')

      app.ontoolresult = (params) => show(params)
      // Centralu's own notification (not part of the MCP Apps standard): the app's state changed.
      app.fallbackNotificationHandler = async (n) => {
        if (n.method === 'centralu/notifications/changed') await reread()
      }
      $('increment').onclick = () => call('increment', { by: 1 })
      $('reset').onclick = () => call('reset')
      app.connect().then(reread)
    </script>
  </body>
</html>
