<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Until Centralu says which theme shows, follow the system's (Centralu's window follows it too). -->
    <meta name="color-scheme" content="light dark" />
    <title>Project board</title>
    <style>
      /*
       * Everything the board looks like comes from Centralu's theme: the host sends the MCP Apps
       * style variables and Centralu's own (applied on <html> by applyTheme below), so a theme
       * switch, or a different font, line height or text size in Settings → Appearance, reshapes
       * the board the way it reshapes Centralu.
       *
       * This block is the only place with fallbacks. They are Centralu's dark defaults, for the
       * moment before the host context arrives; every rule below reads these names and nothing
       * else. Contrast is urgency: the signal colour (the standard's warning text, pure white in
       * dark and pure black in light) marks only what waits on the owner.
       */
      :root {
        /* Colour roles */
        --bg: var(--color-background-primary, #0f0f0f);
        --surface: var(--color-background-secondary, #242424);
        --ink: var(--color-text-primary, #ededed);
        --ink-2: var(--color-text-secondary, #a8a8a8);
        --ink-3: var(--color-text-tertiary, #707070);
        --edge: var(--color-border-primary, #363636);
        --edge-strong: var(--color-border-secondary, #4d4d4d);
        --ring: var(--color-ring-primary, #b4b4b4);
        --beacon: var(--centralu-signal, var(--color-text-warning, #ffffff));
        --danger: var(--color-text-danger, #ff9b91);
        /* Behind the reader: the floor, mostly opaque, so the board recedes without a colour of its own */
        --scrim: color-mix(in srgb, var(--bg) 78%, transparent);
        /* Type: what a person reads, the controls around it, and the board's one heading */
        --sans: var(--font-sans, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', system-ui, sans-serif);
        --mono: var(--font-mono, ui-monospace, 'SF Mono', Menlo, monospace);
        --text: var(--font-text-md-size, 13px);
        --text-sm: var(--font-text-sm-size, 12px);
        --leading: var(--font-text-md-line-height, 1.65);
        --heading: var(--font-heading-xs-size, 13px);
        --leading-tight: var(--font-heading-xs-line-height, 1.3);
        --regular: var(--font-weight-normal, 400);
        --semibold: var(--font-weight-semibold, 600);
        /* Shape: small marks, controls and cards, panels */
        --radius-sm: var(--border-radius-sm, 3px);
        --radius-md: var(--border-radius-md, 4px);
        --radius-lg: var(--border-radius-lg, 8px);
        --border: var(--border-width-regular, 1px);
        /* Centralu's scrollbar (the block at the end) */
        --sb-size: var(--centralu-scrollbar-size, 10px);
        --sb-inset: var(--centralu-scrollbar-inset, 3px);
        --sb-radius: var(--centralu-scrollbar-radius, 999px);
        --sb-track: var(--centralu-scrollbar-track, transparent);
        --sb-thumb: var(--centralu-scrollbar-thumb, #3c3c3c);
        --sb-thumb-hover: var(--centralu-scrollbar-thumb-hover, #4d4d4d);
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        display: flex;
        flex-direction: column;
        font-family: var(--sans);
        font-size: var(--text);
        line-height: var(--leading);
        font-weight: var(--regular);
        color: var(--ink);
        background: transparent;
      }
      header {
        display: flex;
        align-items: center;
        gap: 8px 12px;
        flex-wrap: wrap;
        padding: 12px 16px 10px;
        border-bottom: var(--border) solid var(--edge);
      }
      h1 { font-size: var(--heading); line-height: var(--leading-tight); font-weight: var(--semibold); margin: 0; }
      h1 a { color: inherit; text-decoration: none; }
      h1 a:hover { text-decoration: underline; text-decoration-color: var(--ink-3); }
      .sub { color: var(--ink-3); }
      .spacer { flex: 1; }
      select, button {
        font: inherit;
        line-height: var(--leading-tight);
        color: var(--ink);
        background: var(--surface);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius-md);
        padding: 3px 8px;
        max-width: 100%;
      }
      button { cursor: pointer; }
      select:hover, button:hover { border-color: var(--edge-strong); }
      button:disabled { color: var(--ink-3); cursor: default; }
      :focus-visible { outline: var(--border) solid var(--ring); outline-offset: 1px; }
      .stamp { color: var(--ink-3); font-variant-numeric: tabular-nums; }

      .notice {
        margin: 12px 16px 0;
        padding: 10px 12px;
        border: var(--border) solid var(--edge-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        white-space: pre-wrap;
      }
      .notice strong { color: var(--beacon); font-weight: var(--semibold); }
      .notice button { margin-left: 8px; }
      .notice code { font-family: var(--mono); }

      .board {
        flex: 1;
        min-height: 0;
        display: flex;
        gap: 12px;
        padding: 12px 16px 16px;
        overflow-x: auto;
      }
      .column {
        flex: 1 0 210px;
        max-width: 340px;
        display: flex;
        flex-direction: column;
        min-height: 0;
        border: var(--border) solid transparent;
        border-radius: var(--radius-lg);
      }
      .column.drop { border-color: var(--ink-3); }
      /* The decision column is what waits on the owner: first, framed, and in the signal colour. */
      .column.decision { border-color: var(--edge-strong); background: var(--surface); }
      .column.decision .col-head { color: var(--beacon); }
      .col-head {
        display: flex;
        align-items: baseline;
        gap: 6px;
        padding: 8px 10px 6px;
        color: var(--ink-2);
        font-weight: var(--semibold);
      }
      .col-head .mark { width: 1em; text-align: center; }
      .col-head .count { color: var(--ink-3); font-weight: var(--regular); font-variant-numeric: tabular-nums; }
      .cards { flex: 1; overflow-y: auto; padding: 0 6px 8px; display: flex; flex-direction: column; gap: 6px; }
      .empty { color: var(--ink-3); padding: 4px 4px 8px; }

      .card {
        background: var(--bg);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius-md);
        padding: 8px 10px;
        cursor: grab;
      }
      .column:not(.decision) .card { background: var(--surface); }
      .card:hover { border-color: var(--edge-strong); }
      .card.saving { opacity: 0.5; }
      .card .title { color: var(--ink); text-decoration: none; display: block; overflow-wrap: anywhere; }
      .card .title:hover { text-decoration: underline; text-decoration-color: var(--ink-3); }
      .meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin-top: 6px; color: var(--ink-2); font-size: var(--text-sm); }
      .num { font-family: var(--mono); color: var(--ink-2); }
      .tag { border: var(--border) solid var(--edge); border-radius: var(--radius-sm); padding: 0 5px; }
      .p-High { color: var(--ink); border-color: var(--ink-3); }
      .p-Medium { color: var(--ink-2); }
      .p-Low { color: var(--ink-3); }
      .move { margin-left: auto; padding: 1px 4px; color: var(--ink-2); max-width: 118px; }
      .num { text-decoration: none; }
      a.num:hover { color: var(--ink); text-decoration: underline; text-decoration-color: var(--ink-3); }

      /*
       * The merge queue (#956): above the board, only while it has items. What needs attention waits
       * on someone, so it takes the signal colour, like the decision column.
       */
      .queue { margin: 12px 16px 0; border: var(--border) solid var(--edge); border-radius: var(--radius-lg); background: var(--surface); display: flex; flex-direction: column; max-height: 33vh; }
      .queue > * { flex: none; }
      .queue > .q-groups { flex: 0 1 auto; min-height: 0; overflow-y: auto; }
      .queue[hidden] { display: none; }
      .queue.attention { border-color: var(--edge-strong); }
      .q-head { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; padding: 8px 10px 4px; color: var(--ink-2); font-weight: var(--semibold); }
      .q-head .quiet { font-weight: var(--regular); }
      .q-head .q-merged-toggle { margin-left: auto; padding: 0 6px; font-size: var(--text-sm); font-weight: var(--regular); }
      .q-groups { display: flex; flex-direction: column; gap: 2px; padding: 0 10px 8px; }
      .q-group { display: grid; grid-template-columns: 9.5em 1fr; gap: 0 10px; }
      .q-group > .q-label { color: var(--ink-2); padding-top: 2px; }
      .q-group.attention > .q-label { color: var(--beacon); font-weight: var(--semibold); }
      .q-group .count { color: var(--ink-3); font-weight: var(--regular); font-variant-numeric: tabular-nums; margin-left: 4px; }
      .q-rows { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
      .q-row { display: flex; align-items: baseline; gap: 6px; flex-wrap: wrap; padding: 2px 0; min-width: 0; }
      .q-row .title { color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
      .q-row .title:hover { text-decoration: underline; text-decoration-color: var(--ink-3); }
      .q-row .why { flex-basis: 100%; color: var(--ink-2); font-size: var(--text-sm); overflow-wrap: anywhere; }
      .q-group.attention .why { color: var(--ink); }
      .q-row .state { color: var(--ink-3); font-size: var(--text-sm); }
      .q-row button { padding: 0 6px; font-size: var(--text-sm); margin-left: auto; }
      @media (max-width: 520px) {
        .queue { margin: 10px 12px 0; }
        .q-group { grid-template-columns: 1fr; }
      }

      /* Board or "Needs decision": two pressed-or-not buttons in the header */
      .modes { display: flex; gap: 4px; }
      .modes button { background: transparent; border-color: transparent; color: var(--ink-2); }
      .modes button:hover { border-color: var(--edge); color: var(--ink); }
      .modes button[aria-pressed='true'] { color: var(--ink); background: var(--surface); border-color: var(--edge-strong); font-weight: var(--semibold); }
      .modes button.decision, .modes button.decision[aria-pressed='true'] { color: var(--beacon); }
      .tag.decision { color: var(--beacon); border-color: var(--edge-strong); }
      .modes .count { color: var(--ink-3); font-weight: var(--regular); font-variant-numeric: tabular-nums; margin-left: 4px; }

      /*
       * The "Needs decision" view: one card per item waiting on the owner, with what its latest
       * summary comment asks and recommends, so most can be answered from here.
       */
      .decisions { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 10px; }
      .decisions[hidden], .board[hidden], .tabs[hidden] { display: none; }
      .dcard {
        max-width: 760px;
        border: var(--border) solid var(--edge-strong);
        border-radius: var(--radius-lg);
        background: var(--surface);
        padding: 10px 12px;
      }
      .dcard .title { color: var(--ink); text-decoration: none; font-weight: var(--semibold); overflow-wrap: anywhere; }
      .dcard .title:hover { text-decoration: underline; text-decoration-color: var(--ink-3); }
      .dcard dl { margin: 8px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; }
      .dcard dt { color: var(--ink-2); }
      .dcard dd { margin: 0; overflow-wrap: anywhere; }
      .dcard .actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
      .dcard .quiet, .quiet { color: var(--ink-3); }
      .answered { color: var(--ink-2); }
      @media (max-width: 520px) {
        .decisions { padding: 10px 12px 12px; }
        .dcard dl { grid-template-columns: 1fr; gap: 0; }
        .dcard dd { margin-bottom: 4px; }
      }

      /*
       * The reader: an issue or pull request read in place, over the board. A modal dialog, so the
       * board behind it takes no keys; Esc closes it and the keyboard goes back to where it was.
       */
      dialog.reader {
        width: min(780px, calc(100vw - 24px));
        max-width: none;
        height: calc(100vh - 24px);
        max-height: none;
        margin: 12px auto;
        padding: 0;
        color: var(--ink);
        background: var(--bg);
        border: var(--border) solid var(--edge-strong);
        border-radius: var(--radius-lg);
      }
      dialog.reader[open] { display: flex; flex-direction: column; }
      dialog.reader::backdrop { background: var(--scrim); }
      .r-head { display: flex; align-items: flex-start; gap: 8px; padding: 12px 14px 10px; border-bottom: var(--border) solid var(--edge); }
      .r-head .r-titles { flex: 1; min-width: 0; }
      .r-kicker { color: var(--ink-2); font-size: var(--text-sm); }
      .r-kicker .num { margin-right: 6px; }
      .r-head h2 { font-size: var(--heading); line-height: var(--leading-tight); font-weight: var(--semibold); margin: 2px 0 0; overflow-wrap: anywhere; }
      .r-close { flex: none; padding: 2px 8px; }
      .r-scroll { flex: 1; min-height: 0; overflow-y: auto; padding: 10px 14px 16px; }
      .r-scroll:focus-visible { outline-offset: -2px; }
      .r-meta { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--ink-2); font-size: var(--text-sm); }
      .r-meta .spacer { flex: 1; }
      .r-meta a { color: var(--ink-2); }
      .r-status { color: var(--ink-2); margin: 10px 0 0; }
      .r-status.error { color: var(--danger); white-space: pre-wrap; }
      .r-summary { margin-top: 12px; padding: 8px 10px; border: var(--border) solid var(--edge-strong); border-radius: var(--radius-md); background: var(--surface); }
      .r-summary .label { color: var(--beacon); font-weight: var(--semibold); }
      .r-summary dl { margin: 6px 0 0; display: grid; grid-template-columns: max-content 1fr; gap: 4px 10px; }
      .r-summary dt { color: var(--ink-2); }
      .r-summary dd { margin: 0; overflow-wrap: anywhere; }
      .post { margin-top: 12px; border: var(--border) solid var(--edge); border-radius: var(--radius-md); }
      .post:focus-visible { outline: var(--border) solid var(--ring); }
      .post-head { display: flex; gap: 6px; flex-wrap: wrap; align-items: baseline; padding: 6px 10px; border-bottom: var(--border) solid var(--edge); background: var(--surface); color: var(--ink-2); font-size: var(--text-sm); border-radius: var(--radius-md) var(--radius-md) 0 0; }
      .post-head .who { color: var(--ink); font-weight: var(--semibold); }
      .post-head a { color: var(--ink-2); }
      .post > .md { padding: 8px 10px; }
      .earlier { margin-top: 12px; }
      .thread { list-style: none; margin: 0; padding: 0; }

      .answer { margin-top: 16px; padding-top: 12px; border-top: var(--border) solid var(--edge); }
      .answer label { display: block; font-weight: var(--semibold); color: var(--beacon); }
      .answer .hint { color: var(--ink-2); font-size: var(--text-sm); margin: 2px 0 6px; }
      .answer textarea {
        display: block;
        width: 100%;
        min-height: 7em;
        resize: vertical;
        font: inherit;
        font-family: var(--mono);
        line-height: var(--leading);
        color: var(--ink);
        background: var(--surface);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius-md);
        padding: 6px 8px;
      }
      .answer textarea:focus-visible { outline: var(--border) solid var(--ring); }
      .answer .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 8px; }
      .answer .row[hidden] { display: none; }
      .answer .error { color: var(--danger); white-space: pre-wrap; margin-top: 6px; }
      .answer .error:empty { display: none; }
      .answer .saved { margin-bottom: 12px; padding: 8px 10px; border: var(--border) solid var(--edge-strong); border-radius: var(--radius-md); background: var(--surface); }
      .answer .saved:focus-visible { outline: var(--border) solid var(--ring); }
      .answer .saved-head { margin: 0; }
      .answer .saved-text { margin: 6px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
      .answer .note { color: var(--ink-2); margin: 8px 0 0; }
      .answer .note:empty { display: none; }
      .dcard .waiting { color: var(--beacon); }
      button.primary { border-color: var(--ink-3); font-weight: var(--semibold); }

      /* The private word list: a short dialog over the board */
      dialog.words { width: min(520px, calc(100vw - 24px)); height: auto; max-height: calc(100vh - 24px); }
      .words-add { margin-top: 0; padding-top: 0; border-top: none; }
      .words-add label { color: var(--ink); }
      .words-add input {
        flex: 1;
        min-width: 0;
        font: inherit;
        color: var(--ink);
        background: var(--surface);
        border: var(--border) solid var(--edge);
        border-radius: var(--radius-md);
        padding: 3px 8px;
      }
      .word-list { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
      .word-list li { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 8px; border: var(--border) solid var(--edge); border-radius: var(--radius-md); }
      .word-list li span { flex: 1; overflow-wrap: anywhere; }
      #release-summary { margin: 0; overflow-wrap: anywhere; }
      #release-summary.error { color: var(--danger); white-space: pre-wrap; }
      .release-lines { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px; color: var(--ink-2); }
      .release-lines li { overflow-wrap: anywhere; }

      @media (max-width: 520px) {
        dialog.reader { width: 100vw; height: 100vh; margin: 0; border: none; border-radius: 0; }
        .r-head { padding: 10px 12px 8px; }
        .r-scroll { padding: 8px 12px 14px; }
        .r-summary dl { grid-template-columns: 1fr; gap: 0; }
      }

      /* Markdown as GitHub shows it, in Centralu's type and colours */
      .md { overflow-wrap: anywhere; }
      .md > :first-child { margin-top: 0; }
      .md > :last-child { margin-bottom: 0; }
      .md p, .md ul, .md ol, .md blockquote, .md pre, .md table, .md details { margin: 0 0 8px; }
      .md h1, .md h2, .md h3, .md h4, .md h5, .md h6 { font-size: var(--heading); line-height: var(--leading-tight); font-weight: var(--semibold); margin: 12px 0 6px; }
      .md h1, .md h2 { padding-bottom: 4px; border-bottom: var(--border) solid var(--edge); }
      .md ul, .md ol { padding-left: 22px; }
      .md ul.tasks { list-style: none; padding-left: 4px; }
      .md li.task-item input { margin: 0 4px 0 0; vertical-align: middle; }
      .md a { color: var(--ink); text-decoration: underline; text-decoration-color: var(--ink-3); }
      .md a.ref, .md a.mention { text-decoration: none; font-weight: var(--semibold); }
      .md a.ref:hover, .md a.mention:hover { text-decoration: underline; }
      .md code { font-family: var(--mono); font-size: 0.92em; background: var(--surface); border: var(--border) solid var(--edge); border-radius: var(--radius-sm); padding: 0 3px; }
      .md pre { background: var(--surface); border: var(--border) solid var(--edge); border-radius: var(--radius-md); padding: 8px 10px; overflow-x: auto; }
      .md pre code { background: none; border: none; padding: 0; font-size: var(--text-sm); white-space: pre; }
      .md blockquote { padding: 0 0 0 10px; border-left: 3px solid var(--edge-strong); color: var(--ink-2); }
      .md table { display: block; max-width: 100%; overflow-x: auto; border-collapse: collapse; }
      .md th, .md td { border: var(--border) solid var(--edge); padding: 3px 8px; vertical-align: top; }
      .md th { font-weight: var(--semibold); background: var(--surface); }
      .md .align-center { text-align: center; }
      .md .align-right { text-align: right; }
      .md img { max-width: 100%; height: auto; border-radius: var(--radius-sm); }
      .md hr { border: none; border-top: var(--border) solid var(--edge); margin: 12px 0; }
      .md kbd { font-family: var(--mono); font-size: var(--text-sm); border: var(--border) solid var(--edge-strong); border-radius: var(--radius-sm); padding: 0 4px; }
      .md summary { cursor: pointer; color: var(--ink-2); }

      /*
       * The status tabs: only in the narrow layout below, where the columns stack and the board is
       * one long page. One per column with its count; a tab scrolls the board to that section, and
       * the section in view lights its tab.
       */
      .tabs { display: none; }
      .tab {
        flex: none;
        display: flex;
        align-items: baseline;
        gap: 5px;
        padding: 3px 8px;
        color: var(--ink-2);
        background: transparent;
        border-color: transparent;
        font-size: var(--text-sm);
        white-space: nowrap;
      }
      .tab:hover { color: var(--ink); border-color: var(--edge); }
      .tab .count { color: var(--ink-3); font-variant-numeric: tabular-nums; }
      .tab.decision { color: var(--beacon); }
      .tab[aria-current] { color: var(--ink); background: var(--surface); border-color: var(--edge-strong); font-weight: var(--semibold); }
      .tab.decision[aria-current] { color: var(--beacon); }

      /*
       * A narrow view: a grid or project-screen panel (about 360–480px), or the inline view under a
       * tool card (#306). Side by side, six columns would leave a sliver each; stacked, every column
       * gets the full width and the board scrolls as one page. The decision column is first either
       * way, so what waits on the owner is still the first thing seen. Dropping a card on another
       * column works the same, since each column is still its own drop target.
       */
      @media (max-width: 520px) {
        header { padding: 10px 12px 8px; }
        .stamp { order: 1; flex-basis: 100%; }
        .board { flex-direction: column; overflow-x: hidden; overflow-y: auto; padding: 10px 12px 12px; gap: 10px; }
        .column { flex: none; max-width: none; }
        .cards { flex: none; overflow: visible; }
        .tabs {
          display: flex;
          gap: 4px;
          padding: 8px 12px;
          overflow-x: auto;
          border-bottom: var(--border) solid var(--edge);
          scrollbar-width: none;
        }
        .tabs::-webkit-scrollbar { display: none; }
      }

      /*
       * Centralu's scrollbar (the app template's block): drawn the way Centralu draws its own, from
       * the theme's scrollbar variables.
       */
      ::-webkit-scrollbar { width: var(--sb-size); height: var(--sb-size); }
      ::-webkit-scrollbar-track { background: var(--sb-track); }
      ::-webkit-scrollbar-thumb {
        background: var(--sb-thumb);
        border: var(--sb-inset) solid transparent;
        background-clip: content-box;
        border-radius: var(--sb-radius);
      }
      ::-webkit-scrollbar-thumb:hover { background: var(--sb-thumb-hover); background-clip: content-box; }
      /* Only where ::-webkit-scrollbar does not exist: elsewhere scrollbar-color would switch it off */
      @supports not selector(::-webkit-scrollbar) {
        * { scrollbar-color: var(--sb-thumb) var(--sb-track); scrollbar-width: thin; }
      }
    </style>
  </head>
  <body>
    <header>
      <h1><a id="title" href="#">Project board</a></h1>
      <span class="sub" id="sub"></span>
      <div class="modes" aria-label="Show">
        <button id="mode-board" type="button" tabindex="0" aria-pressed="true">Board</button>
        <button id="mode-decisions" class="decision" type="button" tabindex="0" aria-pressed="false"><span id="decision-label">Needs decision</span><span class="count" id="decision-count"></span></button>
      </div>
      <span class="spacer"></span>
      <select id="area" aria-label="Filter by Area"><option value="">All areas</option></select>
      <select id="priority" aria-label="Filter by Priority"><option value="">All priorities</option></select>
      <span class="stamp" id="stamp"></span>
      <button id="refresh" type="button">Refresh</button>
      <button id="words-open" type="button" tabindex="0" title="Words that must not appear in public text">Private words</button>
      <button id="release-open" type="button" tabindex="0" title="Where the release stands">Release</button>
    </header>
    <div id="notice" hidden></div>
    <section class="queue" id="queue" hidden aria-labelledby="queue-title"></section>
    <nav class="tabs" id="tabs" aria-label="Statuses"></nav>
    <main class="board" id="board" aria-live="polite"></main>
    <main class="decisions" id="decisions" hidden aria-label="Items that need a decision"></main>

    <!-- The reader: an item read in place. Filled by openReader; its answer box is kept across re-reads. -->
    <dialog class="reader" id="reader" aria-labelledby="reader-title">
      <div class="r-head">
        <div class="r-titles">
          <div class="r-kicker" id="reader-kicker"></div>
          <h2 id="reader-title"></h2>
        </div>
        <button class="r-close" id="reader-close" type="button" tabindex="0" aria-label="Close">Close</button>
      </div>
      <div class="r-scroll" id="reader-scroll" tabindex="0" aria-labelledby="reader-title">
        <div class="r-meta" id="reader-meta"></div>
        <p class="r-status" id="reader-status" role="status"></p>
        <div id="reader-summary"></div>
        <div id="reader-thread"></div>
        <!-- The owner's answer is saved on this computer only, never posted as written: an agent records the decision in English -->
        <form class="answer" id="answer" hidden>
          <section id="answer-saved" class="saved" hidden tabindex="-1" aria-labelledby="answer-saved-title">
            <p class="saved-head"><strong id="answer-saved-title">Your answer</strong> <span class="answered" id="answer-saved-state"></span></p>
            <p class="saved-text" id="answer-saved-text"></p>
            <div class="row" id="answer-saved-actions">
              <button type="button" id="answer-change" tabindex="0">Edit</button>
              <button type="button" id="answer-delete" tabindex="0">Delete</button>
            </div>
          </section>
          <div id="answer-edit">
            <label for="answer-text" id="answer-label">Answer this decision</label>
            <p class="hint" id="answer-hint"></p>
            <textarea id="answer-text" rows="6" spellcheck="true"></textarea>
            <div class="row">
              <button type="submit" class="primary" id="answer-save" tabindex="0">Save answer</button>
              <button type="button" id="answer-cancel" tabindex="0" hidden>Cancel</button>
              <span class="quiet">⌘↩ or Ctrl+↩</span>
            </div>
          </div>
          <p class="note" id="answer-note" role="status"></p>
          <div class="error" id="answer-error" role="alert"></div>
        </form>
      </div>
    </dialog>

    <!-- The private word list: kept in the app's data folder, edited here and by edit_private_words -->
    <dialog class="reader words" id="words" aria-labelledby="words-title">
      <div class="r-head">
        <div class="r-titles">
          <h2 id="words-title">Private words</h2>
          <div class="r-kicker">Never in a comment, issue, pull request or commit message this app sends. Kept on this machine only, not in the repository.</div>
        </div>
        <button class="r-close" id="words-close" type="button" tabindex="0">Close</button>
      </div>
      <div class="r-scroll">
        <form class="answer words-add" id="words-form">
          <label for="words-input">Add a word or a name</label>
          <div class="row">
            <input id="words-input" type="text" autocomplete="off" spellcheck="false" maxlength="100" />
            <button type="submit" tabindex="0">Add</button>
          </div>
          <div class="error" id="words-error" role="alert"></div>
        </form>
        <p class="r-status" id="words-status" role="status"></p>
        <ul class="word-list" id="words-list" aria-label="Private words"></ul>
      </div>
    </dialog>

    <!-- The release: where it stands, read by release_status. The steps are the agent's (the release tool); this shows them. -->
    <dialog class="reader words" id="release" aria-labelledby="release-title">
      <div class="r-head">
        <div class="r-titles">
          <h2 id="release-title">Release</h2>
          <div class="r-kicker">Bump, rehearse, tag and approve are done by an agent with the release tool; each step shows here.</div>
        </div>
        <button class="r-close" id="release-refresh" type="button" tabindex="0">Read again</button>
        <button class="r-close" id="release-close" type="button" tabindex="0">Close</button>
      </div>
      <div class="r-scroll">
        <p id="release-summary" role="status"></p>
        <ul class="release-lines" id="release-lines" aria-label="Release state"></ul>
      </div>
    </dialog>

    <!-- Centralu replaces this tag with the MCP App bridge (runtime/mcp-app.js). Keep it. -->
    <script src="centralu:mcp-app.js"></script>
    <script>
      // The screen holds no board of its own: it draws what the server read from GitHub, and asks
      // again when Centralu says the app's state changed (someone moved an item).
      const app = new McpApp.App({ name: 'project-board', version: '0.1.0' })
      const $ = (id) => document.getElementById(id)
      const MARK = { 'Needs decision': '●', 'In progress': '◆', 'In review': '◆', 'On hold': '▬', Done: '○' }

      let state = null // the last structuredContent from show
      const saving = new Set() // item ids with a write in flight
      let notice = null // { strong, text }

      function el(tag, props = {}, ...children) {
        const n = document.createElement(tag)
        for (const [k, v] of Object.entries(props)) {
          if (k === 'class') n.className = v
          else if (k.startsWith('on')) n.addEventListener(k.slice(2), v)
          else if (v !== undefined && v !== null && v !== false) n.setAttribute(k, v === true ? '' : v)
        }
        for (const c of children) if (c !== null && c !== undefined) n.append(c)
        return n
      }
      // A 24-hour local clock, so an English label never carries another language's AM/PM
      const clock = (iso) => {
        const d = new Date(iso)
        return [d.getHours(), d.getMinutes(), d.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':')
      }
      const textOf = (r) => (r?.content ?? []).map((c) => c.text ?? '').join('\n')
      const open = (url) => url && app.openLink({ url }).catch(() => {})

      function fillFilter(select, values, label) {
        const keep = select.value
        select.replaceChildren(el('option', { value: '' }, label), ...values.map((v) => el('option', { value: v }, v)))
        select.value = values.includes(keep) ? keep : ''
      }

      function renderNotice() {
        const box = $('notice')
        if (!notice) {
          box.hidden = true
          box.replaceChildren()
          return
        }
        box.hidden = false
        box.className = 'notice'
        box.replaceChildren(
          ...[
            el('strong', {}, notice.strong),
            ' ',
            notice.text,
            notice.dismiss ? el('button', { type: 'button', onclick: () => ((notice = null), renderNotice()) }, 'Dismiss') : null,
          ].filter((c) => c !== null),
        )
      }

      function render() {
        renderNotice()
        const board = $('board')
        if (!state || !state.ok) {
          board.replaceChildren()
          $('decisions').replaceChildren()
          return
        }
        const decisionItems = state.items.filter((i) => i.status === state.decisionStatus)
        $('decision-label').textContent = state.decisionStatus
        $('decision-count').textContent = String(decisionItems.length)
        board.hidden = mode !== 'board'
        $('tabs').hidden = mode !== 'board'
        $('decisions').hidden = mode !== 'decisions'
        $('title').textContent = state.project.title
        $('title').href = state.project.url
        $('sub').textContent = `GitHub Project #${state.project.number} of ${state.project.owner}`
        $('stamp').textContent = `Read from GitHub at ${clock(state.fetchedAt)}`
        fillFilter($('area'), state.options.area, 'All areas')
        fillFilter($('priority'), state.options.priority, 'All priorities')
        const area = $('area').value
        const priority = $('priority').value
        const visible = state.items.filter((i) => (!area || i.area === area) && (!priority || i.priority === priority))
        const rank = Object.fromEntries(state.options.priority.map((p, n) => [p, n]))
        const cols = [...state.columns, ...(visible.some((i) => !i.status) ? [null] : [])]
        const groups = cols.map((status) => ({
          status,
          items: visible
            .filter((i) => i.status === status)
            .sort((a, b) => (rank[a.priority] ?? 99) - (rank[b.priority] ?? 99) || (b.number ?? 0) - (a.number ?? 0)),
        }))
        board.replaceChildren(...groups.map((g) => column(g.status, g.items)))
        renderTabs(groups)
        renderDecisions()
      }

      /*
       * The narrow layout's status tabs (CSS shows them only there). A tab scrolls the board so its
       * section stands at the top, where the first one stands unscrolled; the tab of the section in
       * view is marked `aria-current`. A tab clicked keeps the mark while the board scrolls to it, so
       * the mark neither runs through the sections in between nor jumps to the last one when the
       * section clicked is too short to reach the top; the person scrolling takes it back.
       */
      let pinned = null // the status of the tab last clicked, until the person scrolls
      const sections = () => [...$('board').querySelectorAll('.column')]
      const keyOf = (status) => status ?? ''

      function renderTabs(groups) {
        $('tabs').replaceChildren(
          ...groups.map(({ status, items }) =>
            el(
              'button',
              {
                type: 'button',
                // Explicit, so WebKit's Tab reaches it too: without it, WebKit (WKWebView) skips buttons
                // unless the system's "keyboard navigation" is on
                tabindex: '0',
                class: `tab${status === state.decisionStatus ? ' decision' : ''}`,
                'data-status': keyOf(status),
                onclick: () => jumpTo(keyOf(status)),
              },
              el('span', {}, status ?? 'No status'),
              el('span', { class: 'count' }, String(items.length)),
            ),
          ),
        )
        markTab()
      }

      function jumpTo(key) {
        const board = $('board')
        const section = sections().find((c) => c.dataset.status === key)
        if (!section) return
        pinned = key
        const pad = parseFloat(getComputedStyle(board).paddingTop) || 0
        const top = board.scrollTop + section.getBoundingClientRect().top - board.getBoundingClientRect().top - pad
        const still = matchMedia('(prefers-reduced-motion: reduce)').matches
        board.scrollTo({ top, behavior: still ? 'auto' : 'smooth' })
        markTab()
      }

      /** The section in view: the last one whose top has reached the board's top (the first, unscrolled) */
      function inView() {
        const board = $('board')
        const pad = parseFloat(getComputedStyle(board).paddingTop) || 0
        const edge = board.getBoundingClientRect().top + pad + 2
        let current = sections()[0]
        for (const c of sections()) if (c.getBoundingClientRect().top <= edge) current = c
        return current?.dataset.status ?? null
      }

      function markTab() {
        const key = pinned ?? inView()
        for (const t of $('tabs').children) {
          if (t.dataset.status === key) {
            t.setAttribute('aria-current', 'location')
            // Keep the marked tab in sight when the row is wider than the view
            const row = $('tabs')
            if (t.offsetLeft < row.scrollLeft || t.offsetLeft + t.offsetWidth > row.scrollLeft + row.clientWidth) row.scrollLeft = t.offsetLeft - 12
          } else t.removeAttribute('aria-current')
        }
      }

      let marking = false
      $('board').addEventListener('scroll', () => {
        if (marking) return
        marking = true
        requestAnimationFrame(() => {
          marking = false
          markTab()
        })
      })
      // The person's own scrolling ends a tab's hold on the mark
      for (const type of ['wheel', 'touchstart', 'pointerdown', 'keydown']) {
        $('board').addEventListener(type, () => {
          if (pinned === null) return
          pinned = null
          markTab()
        }, { passive: true })
      }

      function column(status, items) {
        const col = el(
          'section',
          { class: `column${status === state.decisionStatus ? ' decision' : ''}`, 'data-status': status ?? '', 'aria-label': status ?? 'No status' },
          el(
            'div',
            { class: 'col-head' },
            el('span', { class: 'mark', 'aria-hidden': 'true' }, MARK[status] ?? ''),
            el('span', {}, status ?? 'No status'),
            el('span', { class: 'count' }, String(items.length)),
          ),
          el('div', { class: 'cards' }, ...(items.length ? items.map(card) : [el('div', { class: 'empty' }, 'No items')])),
        )
        if (status) {
          col.addEventListener('dragover', (e) => {
            if (!e.dataTransfer.types.includes('text/x-item')) return
            e.preventDefault()
            col.classList.add('drop')
          })
          col.addEventListener('dragleave', (e) => {
            if (!col.contains(e.relatedTarget)) col.classList.remove('drop')
          })
          col.addEventListener('drop', (e) => {
            e.preventDefault()
            col.classList.remove('drop')
            const id = e.dataTransfer.getData('text/x-item')
            const item = state.items.find((i) => i.itemId === id)
            if (item && item.status !== status) move(item, status)
          })
        }
        return col
      }

      /** `owner/repo#8` for an item the reader can open, else null (a draft, or an item this login cannot see) */
      const itemKey = (item) => (item.number != null && item.repository ? `${item.repository}#${item.number}` : null)

      /**
       * A click on an item's title or number reads it here. With a modifier key, or for an item the
       * reader cannot open, it goes to GitHub as before.
       */
      function openFromLink(e, item) {
        e.preventDefault()
        const key = itemKey(item)
        if (!key || e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return open(item.url)
        openReader(key, e.currentTarget)
      }

      function card(item) {
        const ref = item.number == null ? 'Draft' : `#${item.number}`
        const kind = item.type === 'pull' ? (item.draft ? 'Draft PR' : 'PR') : null
        const movable = item.number != null && !saving.has(item.itemId)
        const select = el(
          'select',
          { class: 'move', 'aria-label': `Status of ${ref}`, disabled: !movable, title: movable ? 'Change status' : 'Draft items are moved on GitHub' },
          ...state.columns.map((s) => el('option', { value: s, selected: s === item.status }, s)),
        )
        if (!item.status) select.prepend(el('option', { value: '', selected: true }, 'No status'))
        select.addEventListener('change', () => move(item, select.value))
        const key = itemKey(item)
        const node = el(
          'article',
          {
            class: `card${saving.has(item.itemId) ? ' saving' : ''}`,
            draggable: movable || item.url ? 'true' : 'false',
            'data-number': item.number ?? '',
            'data-ref': key ?? undefined,
          },
          item.url
            ? el('a', { class: 'title', href: item.url, tabindex: '0', title: key ? 'Read it here (with ⌘ or Ctrl: on GitHub)' : undefined, onclick: (e) => openFromLink(e, item) }, item.title)
            : el('span', { class: 'title' }, item.title),
          el(
            'div',
            { class: 'meta' },
            // The number reads the item too, by mouse; the title is its one stop for the keyboard
            item.url ? el('a', { class: 'num', href: item.url, tabindex: '-1', onclick: (e) => openFromLink(e, item) }, ref) : el('span', { class: 'num' }, ref),
            kind ? el('span', { class: 'tag' }, kind) : null,
            item.priority ? el('span', { class: `tag p-${item.priority}` }, item.priority) : null,
            item.area ? el('span', { class: 'tag' }, item.area) : null,
            saving.has(item.itemId) ? el('span', {}, 'Saving…') : select,
          ),
        )
        // A card carries its link too, so it drops into a session's composer as one (Centralu's
        // drag contract, docs/apps.md): `text/uri-list` and `text/plain`. Only a movable card
        // carries the item, which a column takes as a move.
        node.addEventListener('dragstart', (e) => {
          if (movable) e.dataTransfer.setData('text/x-item', item.itemId)
          if (item.url) {
            e.dataTransfer.setData('text/uri-list', item.url)
            e.dataTransfer.setData('text/plain', item.number == null ? item.title : `#${item.number} ${item.title}`)
          }
          e.dataTransfer.effectAllowed = 'copyMove'
        })
        return node
      }

      async function move(item, status) {
        saving.add(item.itemId)
        render()
        try {
          const r = await app.callServerTool({ name: 'set_item_fields', arguments: { item: `${item.repository}#${item.number}`, status } })
          if (r?.isError) notice = { strong: `Could not move #${item.number}.`, text: textOf(r), dismiss: true }
        } catch (e) {
          notice = { strong: `Could not move #${item.number}.`, text: String(e?.message ?? e), dismiss: true }
        } finally {
          saving.delete(item.itemId)
        }
        await load(false)
      }

      // --- What the server rendered --------------------------------------------------------------
      // The server writes Markdown as HTML from a short list of tags (markdown.mjs). It goes in through
      // an inert <template>, and anything outside that list is removed before it reaches the page,
      // so even a renderer bug cannot run a script or load from elsewhere: the view's CSP allows
      // inline script (docs/apps.md §6.4), so this is the second line, not the CSP.
      const TAGS = {
        P: [], BR: [], HR: [], H1: [], H2: [], H3: [], H4: [], H5: [], H6: [], STRONG: [], EM: [], DEL: [], CODE: ['class'], PRE: [],
        BLOCKQUOTE: [], UL: ['class'], OL: ['start'], LI: ['class'], INPUT: ['type', 'disabled', 'checked'], TABLE: [], THEAD: [], TBODY: [],
        TR: [], TH: ['class'], TD: ['class'], A: ['href', 'title', 'class', 'data-item'], IMG: ['src', 'alt', 'title', 'width', 'height', 'loading', 'referrerpolicy'],
        DETAILS: ['open'], SUMMARY: [], SUB: [], SUP: [], KBD: [], B: [], I: [], S: [], INS: [], MARK: [], SMALL: [], U: [],
      }
      // Elements whose text is code or markup, not words: removed whole rather than shown as text
      const DROP = new Set(['SCRIPT', 'STYLE', 'TEMPLATE', 'NOSCRIPT', 'IFRAME', 'OBJECT', 'EMBED', 'SVG', 'MATH'])
      function clean(root) {
        for (const node of [...root.querySelectorAll('*')]) {
          if (!root.contains(node)) continue // inside something already removed
          const allowed = TAGS[node.tagName]
          if (!allowed) {
            if (DROP.has(node.tagName.toUpperCase())) node.remove()
            else node.replaceWith(document.createTextNode(node.textContent ?? ''))
            continue
          }
          for (const a of [...node.attributes]) if (!allowed.includes(a.name)) node.removeAttribute(a.name)
          if (node.tagName === 'A' && node.hasAttribute('href') && !/^(https?:|mailto:)/i.test(node.getAttribute('href'))) node.removeAttribute('href')
          if (node.tagName === 'IMG' && !/^https:\/\//i.test(node.getAttribute('src') ?? '')) node.remove()
          if (node.tagName === 'INPUT') {
            node.setAttribute('type', 'checkbox')
            node.setAttribute('disabled', '')
          }
        }
      }
      function htmlNode(tag, html, props = {}) {
        const t = document.createElement('template')
        t.innerHTML = html ?? ''
        clean(t.content)
        const n = el(tag, props)
        n.append(t.content)
        return n
      }

      const pad = (n) => String(n).padStart(2, '0')
      const dayOf = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`
      const when = (iso) => {
        if (!iso) return ''
        const d = new Date(iso)
        return Number.isNaN(d.getTime()) ? String(iso) : `${dayOf(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}`
      }
      /** `#8` in the board's own repository, `owner/repo#8` elsewhere */
      const shortRef = (key) => {
        const at = key.lastIndexOf('#')
        return state?.repository && key.slice(0, at).toLowerCase() === state.repository.toLowerCase() ? key.slice(at) : key
      }
      const KIND = { issue: 'Issue', pull: 'Pull request' }
      const STATE = { OPEN: 'Open', CLOSED: 'Closed', MERGED: 'Merged' }
      const rank = (p) => Object.fromEntries((state?.options?.priority ?? []).map((x, n) => [x, n]))[p] ?? 99

      // --- "Needs decision": what each item asks, from its latest summary comment ----------------------
      let mode = 'board' // or 'decisions'
      let decisionData = null // the last decision_summaries answer
      let decisionError = null
      let decisionLoading = false
      let decisionSeq = 0

      function setMode(m) {
        mode = m
        $('mode-board').setAttribute('aria-pressed', String(m === 'board'))
        $('mode-decisions').setAttribute('aria-pressed', String(m === 'decisions'))
        render()
        if (m === 'decisions') loadDecisions(false)
      }

      async function loadDecisions(refresh) {
        const seq = ++decisionSeq
        decisionLoading = true
        renderDecisions()
        let r
        try {
          r = await app.callServerTool({ name: 'decision_summaries', arguments: refresh ? { refresh: true } : {} })
        } catch (e) {
          r = { content: [{ type: 'text', text: String(e?.message ?? e) }] }
        }
        if (seq !== decisionSeq) return
        decisionLoading = false
        const sc = r?.structuredContent
        if (sc?.ok) {
          decisionData = sc
          decisionError = null
        } else decisionError = sc?.error?.message ?? (textOf(r) || 'The app gave no answer.')
        renderDecisions()
      }

      function renderDecisions() {
        const box = $('decisions')
        if (mode !== 'decisions' || !state?.ok) return
        const area = $('area').value
        const priority = $('priority').value
        // The board says which items wait; the summaries arrive after it
        const items = state.items
          .filter((i) => i.status === state.decisionStatus && itemKey(i) && (!area || i.area === area) && (!priority || i.priority === priority))
          .sort((a, b) => rank(a.priority) - rank(b.priority) || (b.number ?? 0) - (a.number ?? 0))
        const read = new Map((decisionData?.items ?? []).map((d) => [`${d.repository}#${d.number}`.toLowerCase(), d]))
        const cards = items.map((i) => decisionCard(i, read.get(itemKey(i).toLowerCase())))
        box.replaceChildren(
          ...(decisionError ? [el('p', { class: 'r-status error' }, `What each decision asks could not be read: ${decisionError}`)] : []),
          ...(cards.length ? cards : [el('p', { class: 'empty' }, `Nothing has the Status ${state.decisionStatus}.`)]),
        )
      }

      function decisionCard(item, read) {
        const key = itemKey(item)
        const s = read?.decision
        // The owner's answer saved on this computer, which no agent has recorded on GitHub yet
        const waiting = read?.ownerAnswer && !read.ownerAnswer.recordedAt
        const fields = s ?[['Question', s.question], ['Recommendation', s.recommendation]].filter(([, v]) => v) : []
        let body
        if (read?.error) body = el('p', { class: 'quiet' }, `Could not read it: ${read.error}`)
        else if (fields.length) body = el('dl', {}, ...fields.flatMap(([k, v]) => [el('dt', {}, k), htmlNode('dd', v, { class: 'md' })]))
        else if (read) body = el('p', { class: 'quiet' }, 'No "Decision needed (summary, …)" comment yet.')
        else body = el('p', { class: 'quiet' }, decisionLoading ? 'Reading what it asks…' : '')
        return el(
          'article',
          { class: 'dcard', 'data-ref': key },
          el('a', { class: 'title', href: item.url, tabindex: '0', onclick: (e) => openFromLink(e, item) }, `${shortRef(key)} ${item.title}`),
          el(
            'div',
            { class: 'meta' },
            item.type === 'pull' ? el('span', { class: 'tag' }, 'PR') : null,
            item.priority ? el('span', { class: `tag p-${item.priority}` }, item.priority) : null,
            item.area ? el('span', { class: 'tag' }, item.area) : null,
            s?.date ? el('span', { class: 'quiet' }, `Summary of ${s.date}`) : null,
            s?.answered ? el('span', { class: 'answered' }, typeof s.answered === 'string' ? `Answered ${when(s.answered)}` : 'Answered') : null,
            waiting ? el('span', { class: 'waiting' }, 'Answered, not recorded yet') : null,
          ),
          body,
          el(
            'div',
            { class: 'actions' },
            el('button', { type: 'button', tabindex: '0', onclick: (e) => openReader(key, e.currentTarget, { focusAnswer: true }) }, waiting ? 'Read your answer' : s?.answered ? 'Read and answer again' : 'Read and answer'),
          ),
        )
      }

      // --- The reader -----------------------------------------------------------------------------
      // One item at a time, over the board. The screen keeps only what is on screen and the drafts in
      // memory; the item is read from the server every time it opens (the server caches it briefly).
      const dlg = $('reader')
      const reader = {
        key: null, // owner/repo#8 shown
        opener: null, // the element the keyboard returns to
        openerKey: null, // and its item, to find it again if the board re-rendered meanwhile
        data: null, // the last read_item answer
        limit: null, // how many comments were asked for
        seq: 0,
        drafts: new Map(), // key → text written and not saved yet
        editing: false, // the saved answer is open in the box
        saving: false,
      }

      function setReaderStatus(text, error = false) {
        const s = $('reader-status')
        s.textContent = text
        s.className = `r-status${error ? ' error' : ''}`
        s.hidden = !text
      }

      function saveDraft() {
        if (!reader.key || $('answer').hidden) return
        const text = $('answer-text').value
        if (text.trim() && !reader.editing) reader.drafts.set(reader.key, text)
        else reader.drafts.delete(reader.key)
      }

      async function openReader(key, opener, { focusAnswer = false } = {}) {
        if (!dlg.open) {
          reader.opener = opener ?? document.activeElement
          reader.openerKey = opener?.closest?.('[data-ref]')?.dataset.ref ?? key
        }
        saveDraft()
        reader.key = key
        reader.data = null
        reader.limit = null
        reader.editing = false
        $('answer-note').textContent = ''
        const known = state?.items?.find((i) => itemKey(i)?.toLowerCase() === key.toLowerCase())
        $('reader-kicker').replaceChildren(el('span', { class: 'num' }, shortRef(key)))
        $('reader-title').textContent = known?.title ?? shortRef(key)
        $('reader-meta').replaceChildren()
        $('reader-summary').replaceChildren()
        $('reader-thread').replaceChildren()
        $('answer').hidden = true
        setReaderStatus(`Reading ${shortRef(key)} from GitHub…`)
        if (!dlg.open) dlg.showModal()
        $('reader-scroll').scrollTop = 0
        $('reader-scroll').focus({ preventScroll: true })
        await loadReader({ focusAnswer })
      }

      async function loadReader({ refresh = false, comments, focusAnswer = false, quiet = false } = {}) {
        const key = reader.key
        if (!key) return
        const seq = ++reader.seq
        if (comments) reader.limit = comments
        if (refresh) setReaderStatus(`Reading ${shortRef(key)} from GitHub…`)
        let r
        try {
          r = await app.callServerTool({ name: 'read_item', arguments: { item: key, ...(refresh ? { refresh: true } : {}), ...(reader.limit ? { comments: reader.limit } : {}) } })
        } catch (e) {
          r = { content: [{ type: 'text', text: String(e?.message ?? e) }] }
        }
        if (seq !== reader.seq || reader.key !== key || !dlg.open) return
        const sc = r?.structuredContent
        if (!sc?.ok) {
          if (!quiet || !reader.data) setReaderStatus(`${shortRef(key)} could not be read: ${sc?.error?.message ?? (textOf(r) || 'the app gave no answer.')}`, true)
          return
        }
        reader.data = sc
        renderReader()
        if (focusAnswer && !$('answer').hidden) {
          $('answer').scrollIntoView({ block: 'nearest' })
          ;($('answer-edit').hidden ? $('answer-saved') : $('answer-text')).focus()
        }
      }

      function post(c, { verb } = {}) {
        return el(
          'article',
          { class: 'post', 'data-id': c.id ?? '', tabindex: '-1', 'aria-label': `${c.author} ${verb} ${when(c.createdAt)}` },
          el(
            'div',
            { class: 'post-head' },
            el('span', { class: 'who' }, c.author),
            el('span', {}, verb),
            c.url ? el('a', { href: c.url, tabindex: '0', title: 'Open on GitHub' }, when(c.createdAt)) : el('span', {}, when(c.createdAt)),
          ),
          htmlNode('div', c.html || '<p>No description.</p>', { class: 'md' }),
        )
      }

      function renderReader() {
        const d = reader.data
        const it = d.item
        const kind = it.type === 'pull' ? (it.draft ? 'Draft pull request' : 'Pull request') : KIND[it.type] ?? 'Item'
        $('reader-kicker').replaceChildren(el('span', { class: 'num' }, shortRef(reader.key)), `${kind} · ${STATE[it.state] ?? it.state}`)
        $('reader-title').textContent = it.title
        $('reader-meta').replaceChildren(
          ...it.labels.map((l) => el('span', { class: 'tag' }, l)),
          ...(it.inProject
            ? [it.status ? el('span', { class: `tag${it.status === d.decisionStatus ? ' decision' : ''}` }, it.status) : el('span', { class: 'quiet' }, 'No status'), it.priority ? el('span', { class: `tag p-${it.priority}` }, it.priority) : null, it.area ? el('span', { class: 'tag' }, it.area) : null]
            : [el('span', { class: 'quiet' }, 'Not in the project')]),
          el('span', { class: 'spacer' }),
          el('button', { type: 'button', tabindex: '0', onclick: () => loadReader({ refresh: true, quiet: true }) }, 'Refresh'),
          el('a', { href: it.url, tabindex: '0', class: 'secondary' }, 'Open on GitHub'),
        )
        const shownCount = d.comments.length
        setReaderStatus(d.totalComments > d.loadedComments ? `The ${d.loadedComments} latest of ${d.totalComments} comments can be read here; the rest are on GitHub.` : '')
        const s = d.decision
        $('reader-summary').replaceChildren(
          ...(s && d.needsDecision
            ? [
                el(
                  'section',
                  { class: 'r-summary', 'aria-label': 'Decision needed' },
                  el('span', { class: 'label' }, `Decision needed${s.date ? ` (summary of ${s.date})` : ''}`),
                  s.answered ? el('span', { class: 'answered' }, ` · answered ${typeof s.answered === 'string' ? when(s.answered) : ''}`) : null,
                  el('dl', {}, ...[['Question', s.question], ['Options', s.options], ['Recommendation', s.recommendation]].filter(([, v]) => v).flatMap(([k, v]) => [el('dt', {}, k), htmlNode('dd', v, { class: 'md' })])),
                ),
              ]
            : []),
        )
        const hidden = d.totalComments - shownCount
        $('reader-thread').replaceChildren(
          post({ author: it.author, createdAt: it.createdAt, url: it.url, html: it.html }, { verb: 'opened' }),
          ...(hidden > 0 && shownCount < d.loadedComments
            ? [el('button', { type: 'button', class: 'earlier', tabindex: '0', onclick: showEarlier }, `Show ${d.loadedComments - shownCount} earlier comment${d.loadedComments - shownCount === 1 ? '' : 's'}`)]
            : []),
          el('ol', { class: 'thread', 'aria-label': 'Comments' }, ...d.comments.map((c) => el('li', {}, post(c, { verb: 'commented' })))),
        )
        renderAnswer()
      }

      /**
       * The owner's answer: saved on this computer only, never posted to GitHub as written (the
       * repository is public). Shown on the item while no agent has recorded it, with Edit and Delete;
       * once recorded, with the address of the English decision comment.
       */
      function renderAnswer() {
        const d = reader.data
        const a = d?.ownerAnswer ?? null
        const waiting = !!a && !a.recordedAt
        const answerable = !!d && (d.needsDecision || waiting)
        const wasHidden = $('answer').hidden
        $('answer').hidden = !answerable
        if (!answerable) return
        const ref = shortRef(reader.key)
        $('answer-saved').hidden = !a
        if (a) {
          $('answer-saved-text').textContent = a.text
          $('answer-saved-state').replaceChildren(
            ...(waiting
              ? [`saved ${when(a.updatedAt ?? a.savedAt)} on this computer, not recorded yet`]
              : [`recorded in English ${when(a.recordedAt)}: `, el('a', { href: a.recordedUrl, tabindex: '0' }, 'the decision comment')]),
          )
          $('answer-saved-title').textContent = waiting ? 'Your answer' : 'Your last answer'
          $('answer-saved-actions').hidden = !waiting || reader.editing
        }
        // A waiting answer is changed through Edit; without one (or once it is recorded) the box takes a new answer
        $('answer-edit').hidden = waiting && !reader.editing
        $('answer-cancel').hidden = !reader.editing
        $('answer-label').textContent = reader.editing ? 'Change your answer' : 'Answer this decision'
        $('answer-save').textContent = reader.editing ? 'Save changes' : 'Save answer'
        $('answer-hint').textContent = `Saved on this computer only, never posted to GitHub as you write it. An agent records the decision on ${ref} in English.`
        if (wasHidden && !reader.editing) {
          $('answer-text').value = reader.drafts.get(reader.key) ?? ''
          $('answer-error').textContent = ''
        }
      }

      async function showEarlier(e) {
        const d = reader.data
        const before = d.comments.length
        await loadReader({ comments: d.loadedComments })
        // The keyboard goes to the first comment that was not there before
        const first = $('reader-thread').querySelectorAll('.thread .post')[0]
        if (reader.data && reader.data.comments.length > before) first?.focus()
        else e?.currentTarget?.focus?.()
      }

      /** Calls one of the answer tools; answers its structured part, or shows why it failed and answers null. */
      async function answerCall(name, args, failed) {
        let r
        try {
          r = await app.callServerTool({ name, arguments: args })
        } catch (e) {
          r = { isError: true, content: [{ type: 'text', text: String(e?.message ?? e) }] }
        }
        const sc = r?.structuredContent
        if (r?.isError || !sc?.ok) {
          $('answer-error').textContent = `${failed}: ${sc?.error?.message ?? (textOf(r) || 'the app gave no answer.')}`
          return null
        }
        $('answer-error').textContent = ''
        return sc
      }

      // The answer: saved on this computer, never posted; an agent records it in English
      async function saveAnswer() {
        if (reader.saving || !reader.data) return
        const key = reader.key
        const text = $('answer-text').value
        $('answer-note').textContent = ''
        if (!text.trim()) {
          $('answer-error').textContent = 'Write the answer first.'
          return
        }
        reader.saving = true
        $('answer-save').disabled = true
        let sc
        try {
          sc = await answerCall('save_answer', { item: key, text, title: reader.data.item?.title }, 'Not saved')
        } finally {
          reader.saving = false
          $('answer-save').disabled = false
        }
        if (!sc) return
        reader.drafts.delete(key)
        if (mode === 'decisions') loadDecisions(false)
        if (reader.key !== key || !dlg.open) return
        reader.data.ownerAnswer = sc.answer
        reader.editing = false
        $('answer-text').value = ''
        renderAnswer()
        $('answer-note').textContent = `Saved on this computer; nothing was posted to GitHub. The agent will record the decision on ${shortRef(key)} in English. Until then you can edit or delete it here.`
        $('answer-saved').focus()
      }

      function changeAnswer() {
        const a = reader.data?.ownerAnswer
        if (!a || a.recordedAt) return
        reader.editing = true
        $('answer-text').value = a.text
        $('answer-note').textContent = ''
        renderAnswer()
        $('answer-text').focus()
      }

      function cancelChange() {
        reader.editing = false
        $('answer-text').value = ''
        $('answer-error').textContent = ''
        renderAnswer()
        $('answer-change').focus()
      }

      async function deleteSavedAnswer() {
        const key = reader.key
        const sc = await answerCall('delete_answer', { item: key }, 'Not deleted')
        if (!sc) return
        if (mode === 'decisions') loadDecisions(false)
        if (reader.key !== key || !dlg.open) return
        reader.data.ownerAnswer = sc.answer
        reader.editing = false
        $('answer-text').value = ''
        renderAnswer()
        $('answer-note').textContent = 'Deleted the saved answer.'
        if ($('answer').hidden) $('reader-scroll').focus()
        else $('answer-text').focus()
      }

      /**
       * A key the input method took (Korean, Japanese, Chinese): the Enter that ends a syllable and
       * the Esc that cancels one are not the person's Enter and Esc (docs/usability.md, Centralu's
       * `composingKey`). WebKit can end the composition before it sends that Enter, which then
       * arrives with `isComposing` false and only its keyCode, 229, says whose it was.
       */
      const composing = (e) => e.isComposing || e.key === 'Process' || e.keyCode === 229

      $('answer').addEventListener('submit', (e) => (e.preventDefault(), saveAnswer()))
      $('answer-text').addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && (e.metaKey || e.ctrlKey) && !composing(e)) (e.preventDefault(), saveAnswer())
      })
      $('answer-text').addEventListener('input', saveDraft)
      $('answer-change').addEventListener('click', changeAnswer)
      $('answer-cancel').addEventListener('click', cancelChange)
      $('answer-delete').addEventListener('click', deleteSavedAnswer)
      $('reader-close').addEventListener('click', () => dlg.close())

      // An Esc the input method took neither steps back nor closes: the dialog's own close follows
      // the keydown, so the keydown is where it is stopped
      let imeEscape = false
      dlg.addEventListener(
        'keydown',
        (e) => {
          if (e.key !== 'Escape' || !composing(e)) return
          imeEscape = true
          e.preventDefault()
          setTimeout(() => (imeEscape = false))
        },
        true,
      )
      // Esc steps back out of changing a saved answer first (the saved one stays), then closes the reader
      dlg.addEventListener('cancel', (e) => {
        if (imeEscape) return e.preventDefault()
        if (reader.editing) {
          e.preventDefault()
          cancelChange()
        }
      })
      dlg.addEventListener('close', () => {
        saveDraft()
        reader.seq++
        reader.key = null
        reader.editing = false
        const visible = (n) => n && n.isConnected && n.getClientRects().length > 0
        let back = visible(reader.opener) ? reader.opener : null
        if (!back && reader.openerKey) back = [...document.querySelectorAll(`[data-ref="${CSS.escape(reader.openerKey)}"] .title`)].find(visible) ?? null
        back?.focus()
      })
      dlg.addEventListener('click', (e) => {
        // A click on the backdrop (the dialog box itself, outside its content) closes it
        if (e.target === dlg) return dlg.close()
        const a = e.target.closest?.('a')
        if (!a || !dlg.contains(a)) return
        e.preventDefault()
        if (a.dataset.item && !(e.metaKey || e.ctrlKey || e.shiftKey || e.altKey)) return openReader(a.dataset.item)
        if (a.href) open(a.href)
      })
      // An image GitHub will not hand this view (a private repository's upload) becomes its link
      dlg.addEventListener(
        'error',
        (e) => {
          const img = e.target
          if (img?.tagName !== 'IMG') return
          img.replaceWith(el('a', { href: img.src, class: 'image-link' }, `Image${img.alt ? `: ${img.alt}` : ''} (opens on GitHub)`))
        },
        true,
      )

      // --- The private word list ------------------------------------------------------------------
      const wordsDlg = $('words')
      let wordsOpener = null

      function renderWords(list) {
        $('words-list').replaceChildren(
          ...list.map((w) =>
            el(
              'li',
              {},
              el('span', {}, w),
              el('button', { type: 'button', tabindex: '0', 'aria-label': `Remove ${w}`, onclick: () => editWords({ remove: [w] }) }, 'Remove'),
            ),
          ),
        )
        $('words-status').textContent = list.length ? `${list.length} word${list.length === 1 ? '' : 's'}.` : 'No words yet.'
      }

      async function callWords(name, args) {
        let r
        try {
          r = await app.callServerTool({ name, arguments: args })
        } catch (e) {
          r = { isError: true, content: [{ type: 'text', text: String(e?.message ?? e) }] }
        }
        if (r?.isError || !Array.isArray(r?.structuredContent?.words)) {
          $('words-error').textContent = r?.structuredContent?.error?.message ?? (textOf(r) || 'The app gave no answer.')
          return null
        }
        $('words-error').textContent = ''
        renderWords(r.structuredContent.words)
        return r.structuredContent.words
      }

      async function openWords(opener) {
        wordsOpener = opener
        $('words-error').textContent = ''
        $('words-status').textContent = 'Reading the list…'
        $('words-list').replaceChildren()
        wordsDlg.showModal()
        $('words-input').focus()
        await callWords('private_words', {})
      }

      async function editWords(change) {
        const removing = change.remove?.[0]
        const list = await callWords('edit_private_words', change)
        if (list && removing) {
          // The keyboard stays in the list: on the first word left, else the field
          const next = $('words-list').querySelector('li button')
          ;(next ?? $('words-input')).focus()
          $('words-status').textContent = `Removed "${removing}". ${$('words-status').textContent}`
        }
        return list
      }

      $('words-open').addEventListener('click', (e) => openWords(e.currentTarget))
      $('words-close').addEventListener('click', () => wordsDlg.close())
      $('words-form').addEventListener('submit', async (e) => {
        e.preventDefault()
        const w = $('words-input').value.trim()
        if (!w) return
        if (await editWords({ add: [w] })) {
          $('words-input').value = ''
          $('words-status').textContent = `Added "${w}". ${$('words-status').textContent}`
        }
        $('words-input').focus()
      })
      wordsDlg.addEventListener('close', () => {
        const back = wordsOpener?.isConnected ? wordsOpener : $('words-open')
        back.focus()
      })
      wordsDlg.addEventListener('click', (e) => e.target === wordsDlg && wordsDlg.close())
      // The input method's Enter does not add the word half-typed, and its Esc does not close the list
      wordsDlg.addEventListener(
        'keydown',
        (e) => {
          if ((e.key === 'Enter' || e.key === 'Escape') && composing(e)) e.preventDefault()
        },
        true,
      )

      // --- The release ---------------------------------------------------------------------------
      const releaseDlg = $('release')
      let releaseOpener = null

      async function loadRelease() {
        $('release-refresh').disabled = true
        let r
        try {
          r = await app.callServerTool({ name: 'release_status', arguments: {} })
        } catch (e) {
          r = { isError: true, content: [{ type: 'text', text: String(e?.message ?? e) }] }
        } finally {
          $('release-refresh').disabled = false
        }
        const sc = r?.structuredContent
        const failed = r?.isError || !sc?.summary
        $('release-summary').className = failed ? 'error' : ''
        $('release-summary').textContent = failed ? sc?.summary ?? (textOf(r) || 'The app gave no answer.') : sc.summary
        $('release-lines').replaceChildren(...[...(sc?.lines ?? []), ...(sc?.problems ?? [])].map((l) => el('li', {}, l)))
      }

      $('release-open').addEventListener('click', (e) => {
        releaseOpener = e.currentTarget
        $('release-summary').className = ''
        $('release-summary').textContent = 'Reading where the release stands…'
        $('release-lines').replaceChildren()
        releaseDlg.showModal()
        $('release-close').focus()
        loadRelease()
      })
      $('release-refresh').addEventListener('click', loadRelease)
      $('release-close').addEventListener('click', () => releaseDlg.close())
      releaseDlg.addEventListener('close', () => (releaseOpener?.isConnected ? releaseOpener : $('release-open')).focus())
      releaseDlg.addEventListener('click', (e) => e.target === releaseDlg && releaseDlg.close())

      // --- The merge queue (#956) -------------------------------------------------------------------
      // The server drives it on its own, so nothing tells this screen when an item moves: while the
      // queue has items in flight, it reads merge_queue (read-only, from the app's data folder) again.
      const QUEUE_GROUPS = [
        ['attention', 'Needs attention'],
        ['ci', 'CI'],
        ['waiting', 'Waiting'],
        ['merged', 'Merged'],
      ]
      let mergedOpen = false // history: collapsed until the person opens it; anything else always shows
      const QUEUE_POLL_MS = 15_000
      let queue = null // merge_queue's structuredContent
      let queueTimer = null

      async function loadQueue() {
        let r
        try {
          r = await app.callServerTool({ name: 'merge_queue', arguments: {} })
        } catch {
          r = null
        }
        queue = r && !r.isError ? r.structuredContent : null
        renderQueue()
        clearTimeout(queueTimer)
        if (queue?.queue?.some((i) => i.state === 'ci' || i.state === 'waiting' || i.state === 'attention')) queueTimer = setTimeout(loadQueue, QUEUE_POLL_MS)
      }

      async function unqueueItem(item, button) {
        button.disabled = true
        const r = await app.callServerTool({ name: 'unqueue', arguments: { pr: `${item.repo}#${item.pr}` } }).catch((e) => ({ isError: true, content: [{ type: 'text', text: String(e?.message ?? e) }] }))
        if (r?.isError) {
          notice = { strong: `Could not take ${item.ref} out of the queue.`, text: textOf(r), dismiss: true }
          renderNotice()
        }
        loadQueue()
      }

      function queueRow(item) {
        const key = `${item.repo}#${item.pr}`
        const url = `https://github.com/${item.repo}/pull/${item.pr}`
        const read = (e) => {
          e.preventDefault()
          if (e.metaKey || e.ctrlKey || e.shiftKey || e.altKey) return open(url)
          openReader(key, e.currentTarget)
        }
        const active = item.state !== 'merged' && item.state !== 'closed'
        const stack = item.lowers?.length ? `stack over ${item.lowers.map((n) => `#${n}`).join(', ')}` : null
        const state =
          item.state === 'merged' ? (item.commit ? `merged as ${item.commit.slice(0, 7)}` : 'merged') : item.state === 'ci' && item.head ? `at ${item.head.slice(0, 7)}` : null
        const why = item.state === 'attention' ? item.reason?.text : item.lastError ? `Last poll failed: ${item.lastError}` : null
        const button = active ? el('button', { type: 'button', tabindex: '0', title: 'Take it out of the queue; nothing on GitHub changes' }, 'Unqueue') : null
        button?.addEventListener('click', () => unqueueItem(item, button))
        return el(
          'li',
          { class: 'q-row', 'data-ref': key, 'data-state': item.state },
          el('a', { class: 'num', href: url, tabindex: '-1', onclick: read }, item.ref),
          el('a', { class: 'title', href: url, tabindex: '0', title: 'Read it here (with ⌘ or Ctrl: on GitHub)', onclick: read }, item.title ?? item.ref),
          stack ? el('span', { class: 'tag' }, stack) : null,
          item.batch ? el('span', { class: 'tag', title: `Tested together with others on ${item.batch.branch}` }, `batch ${item.batch.id}${item.batch.state === 'landing' ? ', landing' : ''}`) : null,
          item.state === 'attention' && item.reason?.kind ? el('span', { class: 'tag decision' }, item.reason.kind) : null,
          state ? el('span', { class: 'state' }, state) : null,
          button,
          why ? el('span', { class: 'why' }, why) : null,
        )
      }

      function renderQueue() {
        const box = $('queue')
        const items = queue?.queue ?? []
        if (!items.length && !queue?.unacked?.length) {
          box.hidden = true
          box.replaceChildren()
          return
        }
        box.hidden = false
        // A re-render (the toggle, the 15 s read) keeps the list where it was scrolled and the keyboard on the toggle
        const scrolled = box.querySelector('.q-groups')?.scrollTop ?? 0
        const refocus = document.activeElement?.id === 'queue-merged-toggle'
        const attention = items.some((i) => i.state === 'attention')
        box.className = `queue${attention ? ' attention' : ''}`
        const groups = QUEUE_GROUPS.map(([state, label]) => ({ state, label, items: items.filter((i) => i.state === state || (state === 'merged' && i.state === 'closed')) })).filter((g) => g.items.length)
        const mergedCount = groups.find((g) => g.state === 'merged')?.items.length ?? 0
        const shown = groups.filter((g) => g.state !== 'merged' || mergedOpen)
        const toggle = mergedCount ? el('button', { type: 'button', class: 'q-merged-toggle', id: 'queue-merged-toggle', 'aria-expanded': String(mergedOpen) }, `${mergedOpen ? 'Hide merged' : 'Merged'} (${mergedCount})`) : null
        toggle?.addEventListener('click', () => ((mergedOpen = !mergedOpen), renderQueue()))
        box.replaceChildren(
          el('div', { class: 'q-head' }, el('span', { id: 'queue-title' }, 'Merge queue'), el('span', { class: 'quiet' }, queue.summary.replace(/^Merge queue: /, '')), toggle),
          // Messages their sessions have not acknowledged (#1351): one line, the sessions ack them with the ack tool
          ...(queue.unacked?.length ? [el('div', { class: 'q-unacked quiet', id: 'queue-unacked' }, `${queue.unacked.length} message${queue.unacked.length === 1 ? '' : 's'} not acknowledged by ${[...new Set(queue.unacked.map((e) => e.owner))].join(', ')}`)] : []),
          shown.length ? el(
            'div',
            { class: 'q-groups' },
            ...shown.map((g) =>
              el(
                'section',
                { class: `q-group ${g.state}`, 'aria-label': g.label },
                el('div', { class: 'q-label' }, g.label, el('span', { class: 'count' }, String(g.items.length))),
                el('ul', { class: 'q-rows' }, ...g.items.map(queueRow)),
              ),
            ),
          ) : null,
        )
        const list = box.querySelector('.q-groups')
        if (list) list.scrollTop = scrolled
        if (refocus) $('queue-merged-toggle')?.focus()
      }

      function show(result) {
        const sc = result?.structuredContent
        if (!sc) {
          notice = { strong: 'The board could not be read.', text: textOf(result) || 'The app gave no answer.' }
          state = null
        } else if (!sc.ok) {
          // Not an empty board: say why there is no board.
          notice = { strong: 'No board: it could not be read from GitHub.', text: sc.error?.message ?? textOf(result) }
          state = null
          $('stamp').textContent = ''
        } else {
          if (notice && !notice.dismiss) notice = null
          state = sc
        }
        render()
      }

      async function load(refresh) {
        $('refresh').disabled = true
        try {
          show(await app.callServerTool({ name: 'show', arguments: refresh ? { refresh: true } : {} }))
        } catch (e) {
          notice = { strong: 'The board could not be read.', text: String(e?.message ?? e) }
          state = null
          render()
        } finally {
          $('refresh').disabled = false
        }
      }

      // Centralu's theme (the MCP Apps host context): the colour scheme, the standard style
      // variables, and Centralu's own (the signal colour and the scrollbar). A change notification
      // carries only what changed, so this reads the whole context the bridge keeps.
      const applyTheme = () => {
        const ctx = app.getHostContext() ?? {}
        const root = document.documentElement
        if (ctx.theme === 'light' || ctx.theme === 'dark') root.style.colorScheme = ctx.theme
        const vars = { ...ctx.styles?.variables, ...ctx.centralu?.variables }
        for (const [name, value] of Object.entries(vars)) if (typeof value === 'string' && value) root.style.setProperty(name, value)
      }
      app.onhostcontextchanged = applyTheme
      app.ontoolresult = (params) => show(params)
      // Centralu's own notification (not part of the MCP Apps standard): the app's state changed.
      app.fallbackNotificationHandler = async (n) => {
        if (n.method !== 'centralu/notifications/changed') return
        // Someone moved an item or commented: the board, the decisions and an open item read again
        // A release step (the release tool) shows in the open release dialog too
        await Promise.all([load(false), loadQueue(), mode === 'decisions' ? loadDecisions(false) : null, dlg.open ? loadReader({ quiet: true }) : null, releaseDlg.open ? loadRelease() : null])
      }
      $('refresh').onclick = () => (load(true), loadQueue(), mode === 'decisions' ? loadDecisions(true) : null)
      $('area').onchange = render
      $('priority').onchange = render
      $('mode-board').onclick = () => setMode('board')
      $('mode-decisions').onclick = () => setMode('decisions')
      app.connect().then(() => {
        applyTheme()
        loadQueue()
        if (!state) return load(false)
      })
    </script>
  </body>
</html>
