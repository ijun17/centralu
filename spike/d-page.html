<!doctype html>
<meta charset="utf-8">
<title>M0 Spike — 브라우저 E2E</title>
<style>
  body { font-family: ui-monospace, monospace; max-width: 640px; margin: 40px auto; }
  #out { white-space: pre-wrap; border: 1px solid #ccc; padding: 12px; min-height: 120px; }
  #status { color: #666; }
</style>
<h1>M0 Spike</h1>
<p id="status">연결 중…</p>
<input id="prompt" size="50" value="Reply with exactly: BROWSER_E2E_OK">
<button id="send">전송</button>
<div id="out"></div>
<script>
  const out = document.getElementById('out')
  const status = document.getElementById('status')
  const ws = new WebSocket(`ws://127.0.0.1:5177/?token=spike-token`)
  ws.onopen = () => { status.textContent = 'WS 연결됨' }
  ws.onclose = e => { status.textContent = 'WS 종료: ' + e.code }
  ws.onmessage = e => {
    const m = JSON.parse(e.data)
    if (m.type === 'hello') status.textContent = `hello 수신 (protocol v${m.protocolVersion})`
    if (m.type === 'message_delta') out.textContent += m.text
    if (m.type === 'turn_complete') { status.textContent = `완료 — $${m.cost?.toFixed(4)} / ${m.tokens} tokens`; status.id = 'done' }
    if (m.type === 'error') out.textContent += '\n[에러] ' + m.message
  }
  document.getElementById('send').onclick = () => {
    out.textContent = ''
    ws.send(JSON.stringify({ type: 'send', text: document.getElementById('prompt').value }))
  }
</script>
